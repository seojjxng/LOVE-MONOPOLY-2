    </div><script>
    const firebaseConfig = { databaseURL: "https://monopolovely-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let miIdx = -1, sala = "", yaEntro = false;
    const nombres = ["Dog", "Horse", "Hat", "Car"];
    const colores = ["#ffb7b2", "#ffd8a8", "#b2f2bb", "#a5d8ff"];

        // Configuración de colores por grupo
    const grupos = [
    {color: "#ff80bf", indices: [1, 3, 4, 5]},
    {color: "#a5d8ff", indices: [7, 10, 11, 13]},
    {color: "#b2f2bb", indices: [14, 15, 16, 17]},
    {color: "#ffd8a8", indices: [19, 20, 21, 23]}, 
    // Grupo Ferrocarriles (Metro, Moto, Avión, Tren): índices 8, 24, 26, 27
    {color: "#f5f5dc", indices: [8, 24, 26, 27]} 
];

        
    const mapa = [
    {n:"SALIDA",p:0},{n:"ITAEWON",p:100},{n:"ARCA COMUNAL",p:0},{n:"BUSAN",p:200},
    {n:"SEOCHO",p:250},{n:"GANGNAM",p:300},{n:"?",p:0},{n:"CYBER CAFÉ",p:400},
    {n:"AUTOMÓVIL",p:450},{n:"CÁRCEL",p:0},{n:"CAFETERÍA",p:500},{n:"RESTAURANTE",p:520},
    {n:"?",p:0},{n:"SPA",p:300},{n:"CINE",p:450},{n:"HOSPITAL",p:200},
    {n:"TEATRO",p:500},{n:"ESTADIO",p:950},{n:"ARCA COMUNAL",p:0},{n:"SMENT",p:1400},
    {n:"YG ENT",p:950},{n:"YJP",p:750},{n:"IMPUESTOS",p:0},{n:"HYBE CORP.",p:2000},
    {n:"MOTO",p:600},{n:"PARADA",p:0},{n:"AVIÓN",p:600},{n:"TREN",p:600}
];

        function obtenerGrupo(pos) { 
    return grupos.find(g => g.indices.includes(pos)); 
}

    // Variables de clima ampliadas
   const climas = [
        {n: "Primavera Soleada", mult: 1.0}, {n: "Primavera Lluviosa, ¡los valores del mercado se mantienen igual!", mult: 1.0},
        {n: "Verano Caluroso", mult: 1.0}, {n: "Verano Nublado, ¡los valores del mercado se mantienen igual!", mult: 1.0},
        {n: "Otoño Fresco", mult: 1.0}, {n: "Otoño Ventoso, ¡los valores del mercado se mantienen igual!", mult: 1.0},
        // Climas adversos que reducen alquiler (porcentaje azar entre 50% y 80%)
        {n: "Lluvia Fuerte. ¡Oh, no!", mult: 0.7}, 
        {n: "Tormenta Eléctrica. ¡Oh, no!", mult: 0.5},
        {n: "Ventisca. ¡Oh, no!", mult: 0.6}, 
        {n: "Nevada Intensa. ¡Oh, no!", mult: 0.6},
        {n: "Tornado. ¡Oh, no!", mult: 0.5}
    ];

    function iniciarRelojClima() {
        setInterval(() => {
            let nuevoClima = Math.floor(Math.random() * climas.length);
            db.ref('salas/' + sala + '/clima').set(nuevoClima);
            log("¡El clima ha cambiado a " + climas[nuevoClima].n + "!");

    }

    let alquilerPendiente = null;
    let turnosSeis = 0;
    const cartasEvento = [
        {txt: "¡Inversión exitosa! Cobras $200", v: 200},

        {txt: "¡Venta de activos! Cobras $250", v: 250},

        {txt: "¡Bono de Naeun Town! Cobras $150", v: 150},
        {txt: "¡Impuesto de lujo! Pagas $100", v: -100},
        {txt: "¡Heredaste una cuantiosa suma de la tía de una tía! Recibes $150", v: 150}
    ];

    function obtenerCarta() { return cartasEvento[Math.floor(Math.random() * cartasEvento.length)]; }
    function cerrarModal() { document.getElementById('modal').style.display = 'none'; document.getElementById('modal-extra').innerHTML = ""; }
    function log(txt) { db.ref('salas/' + sala + '/log').push(txt); }

        function gestionarFraude() {
    let extra = document.getElementById('modal-extra');
    document.getElementById('modal-title').innerText = "Corte Penal";
    
    let htmlContent = `
        <div class="card-property">
            <p>Has sido acusado de <b>FRAUDE</b> por acumular tres 6 seguidos.</p>
            <p>¡Tienes derecho a un abogado! ¿Quieres pagar la penalidad?</p>
            <button class="btn" onclick="pagarPenalidad()">Pagar $250</button>

        </div>
    `;
    document.getElementById('modal-text').innerHTML = htmlContent;
    extra.innerHTML = ""; // Limpiamos botones extra
    document.getElementById('modal').style.display = 'block';
}

function pagarPenalidad() {
    db.ref('salas/' + sala + '/jugadores/' + miIdx).update({ enCarcel: 0 });
    db.ref('salas/' + sala + '/jugadores/' + miIdx + '/dinero').transaction(d => d - 250);
    log(nombres[miIdx] + " pagó la multa de fraude y fue liberado.");
    cerrarModal();
}
    
    function unirse() {
    // 1. Obtener ID de sala desde el input
    let inputSala = document.getElementById('sala-id');
    if (!inputSala || !inputSala.value) {
        alert("Por favor, ingresa un ID de sala.");
        return;
    }
    
    // Aseguramos que 'sala' sea una cadena limpia
    sala = inputSala.value.trim();

    if (yaEntro) return;
    yaEntro = true;
    
    let btn = document.getElementById('btn-unirse');
    if (btn) btn.disabled = true;

    // 2. Usamos .transaction o .once para asegurar que el índice sea único
    db.ref('salas/' + sala + '/jugadores').once('value', snap => {
        miIdx = snap.numChildren();
        
        // Proteccion: Si no existe el nombre, usamos "Jugador " + miIdx
        let miNombre = (typeof nombres !== 'undefined' && nombres[miIdx]) ? nombres[miIdx] : ("Jugador " + (miIdx + 1));
        
        let jugadorRef = db.ref('salas/' + sala + '/jugadores/' + miIdx);
        
        // 3. Crear el jugador
        jugadorRef.set({
            pos: 0,
            dinero: 1000,
            enCarcel: 0,
            nombre: miNombre, // Es mejor guardar el nombre en Firebase
            tienePrestamo: false,
            montoPrestamo: 0
        }).then(() => {
            // 4. Configurar eventos de desconexión
            jugadorRef.onDisconnect().remove();
            
            let mensajeRef = db.ref('salas/' + sala + '/chat').push(); 
mensajeRef.onDisconnect().set({ n: "Sistema", m: nombres[miIdx] + " ha abandonado." });

            // 5. Lógica de inicio de sala
            if (miIdx === 0) {
                db.ref('salas/' + sala + '/turno').set(0);
                if (typeof iniciarRelojClima === 'function') iniciarRelojClima();
            }

            db.ref('salas/' + sala + '/chat').push({
                n: "Sistema",
                m: miNombre + " ha entrado a la sala."
            });

            // 6. Iniciar sincronización
            sincronizar();
        }).catch(error => {
            console.error("Error al unirse a la sala:", error);
            yaEntro = false;
            if (btn) btn.disabled = false;
        });
    });
}


        function obtenerAlquilerFerrocarril(dueñoIdx, todasLasPropiedades) {
    const indicesTransporte = [8, 24, 26, 27];
    let cantidad = 0;
    
    // Contamos cuántos transportes tiene el dueño
    indicesTransporte.forEach(idx => {
        if (todasLasPropiedades[idx] && todasLasPropiedades[idx].owner === dueñoIdx) {
            cantidad++;
        }
    });

    // Lógica de precios según cantidad
    const tabla = { 1: 100, 2: 150, 3: 250, 4: 300 };
    return tabla[cantidad] || 0;
}

    db.ref('salas/' + sala + '/jugadores/' + miIdx + '/misionesCumplidas').once('value', snap => {
        let completadas = snap.val() || {};
        let lista = document.getElementById('lista-misiones');

function mostrarNotificacionMision(titulo) {
    document.getElementById('msg-mision').innerText = titulo;
    document.getElementById('modal-mision-completada').style.display = 'block';
}

        function verificarMisionNegociador(jugadorIdx) {
    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/misionesCumplidas/negociador').once('value', snap => {
        if (!snap.val()) {
            // 1. Marcar como completada en BD
            db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/misionesCumplidas/negociador').set(true);
            
            // 2. Entregar recompensa
            db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/dinero').transaction(d => d + 400);
            
            // 3. Registrar el logro para que el cliente lo detecte
            db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/ultimaMision').set("negociador");
            
            log(nombres[jugadorIdx] + " completó la misión: El negociador.");
        }
    }); // <--- Aquí se cierra correctamente el .once
}

        function verificarMisionInversor(jugadorIdx) {
    db.ref('salas/' + sala).once('value', snap => {
        let data = snap.val();
        if (!data.propiedades) return;

        // Contamos cuántas propiedades tienen como owner al jugador actual
        let totalPropiedades = Object.values(data.propiedades).filter(p => p.owner === jugadorIdx).length;

        if (totalPropiedades >= 3) {
            db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/misionesCumplidas/inversorInicial').once('value', snap => {
                if (!snap.val()) { // Solo si no la ha cumplido antes

                    // 1. Marcar como cumplida en BD
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/misionesCumplidas/inversorInicial').set(true);
                    
                    // 2. Entregar recompensa
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/dinero').transaction(d => d + 200);
                    
                    // 3. Registrar el logro para que sincronizar() lo detecte
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/ultimaMision').set("inversor");
                    
                    log(nombres[jugadorIdx] + " completó la misión: Inversor Inicial.");
                }
            }); // <--- Cierra el .once de misionesCumplidas
        } // <--- Cierra el if (totalPropiedades >= 3)
    }); // <--- Cierra el .once de salas/sala
}

        function verificarMisionColeccionista(jugadorIdx) {
    db.ref('salas/' + sala).once('value', snap => {
        let data = snap.val();
        if (!data.propiedades) return;

        // Revisamos cada grupo de color definido en tu array 'grupos'
        let tieneSetCompleto = grupos.some(g => {
            return g.indices.every(idx => 
                data.propiedades[idx] && data.propiedades[idx].owner === jugadorIdx
            );
        });

        if (tieneSetCompleto) {
            db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/misionesCumplidas/coleccionista').once('value', snap => {
                if (!snap.val()) { // Si no la ha cumplido aún
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/misionesCumplidas/coleccionista').set(true);
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/dinero').transaction(d => d + 300);
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/ultimaMision').set("coleccionista");

        function verificarMisionMonopolioTotal(jugadorIdx) {
    db.ref('salas/' + sala + '/propiedades').once('value', snap => {
        let propiedades = snap.val();
        if (!propiedades) return;

        // Debes definir aquí los IDs de los grupos más caros (ejemplo: grupos 6, 7 y 8)
        // Ajusta los números según tu array de 'grupos'
        const setsMasCaros = [6, 7, 8]; 

        let tieneTodosLosSets = setsMasCaros.every(grupoIdx => {
            return grupos[grupoIdx].indices.every(pIdx => 
                propiedades[pIdx] && propiedades[pIdx].owner === jugadorIdx
            );
        });

        if (tieneTodosLosSets) {
            db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/misionesCumplidas/monopolioTotal').once('value', snap => {
                if (!snap.val()) { // Solo si no se ha reclamado
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/misionesCumplidas/monopolioTotal').set(true);
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/dinero').transaction(d => d + 1500);
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/ultimaMision').set("monopolioTotal");
                    
                    log(nombres[jugadorIdx] + " completó la misión: ¡Monopolio Total!");
                }
            });
        }
    });
}

        

        function verificarMisionRenovador(jugadorIdx) {
    db.ref('salas/' + sala + '/propiedades').once('value', snap => {
        let propiedades = snap.val();
        if (!propiedades) return;

        // Sumamos el nivel de todas las propiedades del jugador
        let totalCasas = Object.values(propiedades)
            .filter(p => p.owner === jugadorIdx)
            .reduce((sum, p) => sum + (p.nivel || 0), 0);

        if (totalCasas >= 5) {
            db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/misionesCumplidas/renovador').once('value', snap => {
                if (!snap.val()) { // Solo si no la ha cumplido
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/misionesCumplidas/renovador').set(true);
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/dinero').transaction(d => d + 500);
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/ultimaMision').set("renovador");
                    
                    log(nombres[jugadorIdx] + " completó la misión: Renovador.");
                }
            });
        }
    });
}

        function verificarMisionCajaFuerte(jugadorIdx, saldoActual) {

                db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/misionesCumplidas/cajafuerte').set(true);

        function abrirBanco() {
    db.ref('salas/' + sala + '/jugadores/' + miIdx).once('value', snap => {
        let j = snap.val();
        let modalTitle = document.getElementById('modal-title');
        let modalText = document.getElementById('modal-text');

        if (j.tienePrestamo) {

            modalExtra.innerHTML = `<button class="btn" onclick="pagarPrestamo()">Liquidar Deuda</button>
                                    <button class="btn" onclick="cerrarModal()">Cerrar</button>`;
        } else {
            let html = `<p>Tu saldo: <b>$${j.dinero}</b></p><p>Selecciona un monto para tu préstamo:</p>`;
            modalText.innerHTML = html;
            
            // Botones de montos
            let montos = [300, 500, 700, 900];
            modalExtra.innerHTML = "";
            montos.forEach(m => {
                modalExtra.innerHTML += `<button class="btn" onclick="pedirPrestamo(${m})">$${m}</button> `;

        function pedirPrestamo(monto) {
    db.ref('salas/' + sala + '/jugadores/' + miIdx).once('value', snap => {
        let j = snap.val();
        
        // Validación: Si ya tiene préstamo, muestra el aviso
        if (j.tienePrestamo) {
            document.getElementById('modal-title').innerText = "⚠️ Error";
            document.getElementById('modal-text').innerHTML = 
                `<p>No puedes solicitar un nuevo préstamo mientras tengas una deuda activa de <b>$${j.montoPrestamo}</b>.</p>
                 <p>Debes liquidar tu deuda actual primero.</p>`;
            document.getElementById('modal-extra').innerHTML = 
                `<button class="btn" onclick="abrirBanco()">Volver al Banco</button>`;
            return; // Detiene la ejecución
        }

        // Si no tiene, procede con la transacción
        db.ref('salas/' + sala + '/jugadores/' + miIdx).transaction(player => {
            if (player && !player.tienePrestamo) {
                player.tienePrestamo = true;
                player.montoPrestamo = monto;
                player.dinero = Number(player.dinero) + monto;
                return player;
            }
        }, (error, committed) => {
            if (committed) {
                log(nombres[miIdx] + " obtuvo un préstamo de $" + monto + ".");
                cerrarModal();
            }
        });
    });
}

    function proponerVenta(pIdx) {
    let comprador = document.getElementById('sel-' + pIdx).value;
    let precioInput = document.getElementById('precio-' + pIdx).value;
    let precio = parseInt(precioInput);

    // Validación: que el precio esté entre 100 y 999
    if (!precio || precio < 100 || precio > 999) {
        alert("Por favor, ingresa un precio válido entre 100 y 999.");
        return;
    }

    db.ref('salas/' + sala + '/ofertas').push({
        prop: pIdx, 
        de: miIdx, 
        para: comprador, 
        precio: precio
    });

    log(nombres[miIdx] + " propuso vender " + mapa[pIdx].n + " a " + nombres[comprador] + " por $" + precio);
    document.getElementById('modal').style.display = 'none';
}

            `;

            document.getElementById('modal').style.display = 'block';

}

    window.confirmarCompra = function(oKey) {
    db.ref('salas/' + sala + '/ofertas/' + oKey).once('value', snap => {
        let o = snap.val();
        if (!o) return;

        db.ref('salas/' + sala + '/jugadores').transaction(j => {
            if (j && j[miIdx] && j[o.de] && j[miIdx].dinero >= o.precio) {
                j[miIdx].dinero -= o.precio;
                j[o.de].dinero += o.precio;
                return j;
            }
            return;
        }, (error, committed) => {
            if (error) {
                console.error("Error en la transacción: ", error);
            } else if (committed) {
                // 1. Ejecución de Misiones
                verificarMisionInversor(miIdx);
                verificarMisionColeccionista(miIdx);
                verificarMisionMonopolioTotal(miIdx);
                verificarMisionRenovador(miIdx);
                verificarMisionNegociador(o.de);

                db.ref('salas/' + sala + '/jugadores/' + miIdx + '/dinero').once('value', s => {
                    verificarMisionCajaFuerte(miIdx, s.val());
                });

                // 2. Acciones finales: Actualizar propiedad, Log y Borrar oferta
                db.ref('salas/' + sala + '/propiedades/' + o.prop).update({
                    owner: miIdx, 
                    hipotecada: false
                });
                
                log(nombres[miIdx] + " compró " + mapa[o.prop].n + " a " + nombres[o.de]);
                db.ref('salas/' + sala + '/ofertas/' + oKey).remove();
                
                // 3. Cierre del modal
                let modal = document.getElementById('modal');
                if (modal) modal.style.display = 'none';
            }
            // Si 'committed' es falso (sin fondos), simplemente no hace nada
        });
    });
};

        

    function hipotecar(pos) { db.ref('salas/'+sala+'/propiedades/'+pos).update({hipotecada: true}); db.ref('salas/'+sala+'/jugadores/'+miIdx+'/dinero').transaction(d => d + Math.floor(mapa[pos].p/2)); log(nombres[miIdx] + " hipotecó " + mapa[pos].n); document.getElementById('modal').style.display = 'none'; }
    function liberar(pos) { db.ref('salas/'+sala+'/propiedades/'+pos).update({hipotecada: false}); db.ref('salas/'+sala+'/jugadores/'+miIdx+'/dinero').transaction(d => d - Math.floor(mapa[pos].p*0.6)); log(nombres[miIdx] + " liberó " + mapa[pos].n); document.getElementById('modal').style.display = 'none'; }
    function intentarEvasion(d, a, m) { let exito = Math.random() < 0.30; if(exito) { let montoFinal = Math.floor(m / 2); procesarPago(d, a, montoFinal, true); log(nombres[d] + " evadió el alquiler exitosamente. Pagará $" + montoFinal); } else { let montoFinal = m + 50; procesarPago(d, a, montoFinal, false); log(nombres[d] + " falló su evasión de pago. Paga $" + montoFinal); } }

    function manejarCasilla(pos) {
    let p = mapa[pos];
    
    // CASO CÁRCEL
    if (p.n === "A LA CÁRCEL" || p.n === "CÁRCEL") {
        db.ref('salas/'+sala+'/jugadores/'+miIdx).update({pos: 8, enCarcel: 2});
        log(nombres[miIdx] + " fue enviado a la cárcel.");
        document.getElementById('modal-title').innerText = "Cárcel";
        document.getElementById('modal-text').innerText = "¡ALTO AHÍ! Estás bajo arresto.";
        document.getElementById('modal-extra').innerHTML = `<button class="btn" onclick="pagarFianza()">Pagar Fianza ($100)</button><button class="btn" onclick="quedarseEnCarcel()">Quedarse</button>`;
        document.getElementById('modal').style.display = 'block';
        turnosSeis = 0;
        pasarTurno();
        return;
    }
    
    // CASO EVENTOS
    if (p.n === "?" || p.n === "ARCA COMUNAL") { 
        ejecutarEvento(p.n); 
        return; 
    }
    
    // CASO PARADA
    if (p.n === "PARADA") {
        db.ref('salas/' + sala + '/impuestosAcumulados').once('value', snap => {
            let acumulado = snap.val() || 0;
            if (acumulado > 0) {
                db.ref('salas/' + sala + '/jugadores/' + miIdx + '/dinero').transaction(d => d + acumulado);
                log(nombres[miIdx] + " llegó a la PARADA y cobró $" + acumulado + " de impuestos.");
                db.ref('salas/' + sala + '/impuestosAcumulados').set(0);
            } else {
                log(nombres[miIdx] + " llegó a la PARADA, pero no había impuestos.");
            }
        });
        return; 
    }
    
    // CASO IMPUESTOS
    if (p.n === "IMPUESTOS") {
        db.ref('salas/' + sala + '/jugadores/' + miIdx + '/dinero').transaction(d => {
            let nuevo = Number(d) - 100;
            setTimeout(() => verificarBancarrota(miIdx, nuevo), 500);
            return nuevo;
        });
        db.ref('salas/' + sala + '/impuestosAcumulados').transaction(a => (a || 0) + 100);
        log(nombres[miIdx] + " pagó impuestos de $100.");
        return;
    }

    // CASO FERROCARRILES (Color crema)
    let g = obtenerGrupo(pos);
    if (g && g.color === "#f5f5dc") {
        db.ref('salas/' + sala).once('value', snap => {
            let data = snap.val();
            let prop = data.propiedades ? data.propiedades[pos] : null;
            
            if (!prop) {
                verPropiedad(pos, true);
            } else if (prop.owner !== miIdx) {
                let trans = [8, 24, 26, 27];
                let count = trans.filter(i => data.propiedades[i] && data.propiedades[i].owner === prop.owner).length;
                let tabla = { 1: 100, 2: 150, 3: 250, 4: 300 };
                let alquiler = tabla[count] || 100;
                procesarPago(miIdx, prop.owner, alquiler);
                log(nombres[miIdx] + " pagó $" + alquiler + " de transporte a " + nombres[prop.owner]);
            } else {
                verPropiedad(pos, false);
            }
        });
        return;
    }

    // SI NO ES NINGUNA DE LAS ANTERIORES, ES PROPIEDAD NORMAL
    verPropiedad(pos, true);
}

        function pagarFianza() {
        db.ref('salas/'+sala+'/jugadores/'+miIdx).update({enCarcel: 0, dinero: firebase.database.ServerValue.increment(-100)});
        log(nombres[miIdx] + " pagó la fianza.");
        document.getElementById('modal').style.display = 'none';
    }

    function quedarseEnCarcel() {
        log(nombres[miIdx] + " cumplirá su condena en la cárcel.");
        document.getElementById('modal').style.display = 'none';
    }

    function pasarTurno() {
        turnosSeis = 0;
        db.ref('salas/'+sala+'/jugadores').once('value', snap => {
            let total = snap.numChildren();
            db.ref('salas/'+sala+'/turno').once('value', tSnap => {
                let t = Number(tSnap.val());
                let nuevoTurno = (t + 1) % total;
                db.ref('salas/'+sala+'/jugadores/'+nuevoTurno).once('value', jSnap => {
                    let jugador = jSnap.val();
                    if(jugador.enCarcel > 0) {
                        log(nombres[nuevoTurno] + " está en la cárcel.");
                        db.ref('salas/'+sala+'/jugadores/'+nuevoTurno).update({ enCarcel: jugador.enCarcel - 1 });
                        db.ref('salas/'+sala+'/turno').set((nuevoTurno + 1) % total);
                    } else {
                        db.ref('salas/'+sala+'/turno').set(nuevoTurno);
                    }
                });
            });
        });
    }

       window.verPropiedad = function(pos, esCaida = false) {
    let modal = document.getElementById('modal');
    let modalText = document.getElementById('modal-text');
    let modalExtra = document.getElementById('modal-extra');
    let modalTitle = document.getElementById('modal-title');

    // Validación de seguridad para evitar que la función se rompa
    if (!modal || !modalText || !mapa[pos]) return;

    let p = mapa[pos];
    
    // Si la casilla no tiene precio, mostramos información básica y salimos
    if (p.p === 0) {
        modalTitle.innerText = p.n;
        modalText.innerHTML = "Casilla especial: " + p.n;
        modal.style.display = 'block';
        return;
    }
    
    let g = obtenerGrupo(pos);
    let esFerrocarril = (g && g.color === "#f5f5dc");
    let iconos = { 8: "https://i.imgur.com/24NquXH.png", 24: "https://i.imgur.com/QMFz9pn.png", 26: "https://i.imgur.com/AINz8Jt.png", 27: "https://i.imgur.com/ZaN9ZUG.png" };
    
    modalExtra.innerHTML = "";
    
    db.ref('salas/' + sala).once('value', snap => {
        let data = snap.val() || {};
        let prop = data.propiedades ? data.propiedades[pos] : null;
        
        let multClima = data.clima !== undefined ? climas[data.clima].mult : 1.0;
        let nombreClima = data.clima !== undefined ? climas[data.clima].n : 'Normal';
        let porcentajes = [0.10, 0.15, 0.20, 0.30, 0.40, 0.50];
        let nivelesNombres = ["Base", "1 Casa", "2 Casas", "3 Casas", "4 Casas", "Hotel"];
        
        let listaAlquileres = "";
        porcentajes.forEach((porc, i) => {
            let precioNormal = Math.floor(p.p * porc);
            let precioClima = Math.floor(precioNormal * multClima);
            let notaClima = (multClima !== 1) ? ` <small style="color:red;">(c/clima: $${precioClima})</small>` : "";
            listaAlquileres += `<li>${nivelesNombres[i]}: $${precioNormal}${notaClima}</li>`;
        });
        
        modalTitle.innerText = "Tarjeta de Propiedad";
        
        let htmlCard = `<div class="card-property"><div class="card-header">${p.n}</div>`;
            
        if (esFerrocarril && iconos[pos]) {
            htmlCard += `<div style="width: 80px; height: 80px; margin: 30px auto 10px auto; background-color: #ff80bf; -webkit-mask: url('${iconos[pos]}') no-repeat center / contain; mask: url('${iconos[pos]}') no-repeat center / contain;"></div>`;
        }
            
        htmlCard += `<p>Valor de compra: <b>$${esFerrocarril ? 600 : p.p}</b></p>`;

        if (!prop) {
            htmlCard += `<p>Estado: <b>Disponible</b></p>`;
            if(esCaida) {
                let precioCompra = esFerrocarril ? 600 : p.p;
                modalExtra.innerHTML = `<button class="btn" onclick="comprar(${pos})">Comprar ($${precioCompra})</button>`;
            }
        } else if (prop.owner === miIdx) {
            htmlCard += `<p>Dueño: <b>Tú</b></p>`;
            if (!esFerrocarril) htmlCard += `<p>Nivel: <b>${nivelesNombres[prop.nivel || 0]}</b></p>`;
            if (!prop.hipotecada) {
                if (!esFerrocarril && prop.nivel < 5) modalExtra.innerHTML += `<button class="btn" onclick="mejorar(${pos})">Mejorar ($50)</button>`;
                modalExtra.innerHTML += `<button class="btn" style="background: #ad0c0c;" onclick="hipotecar(${pos})">Hipotecar</button>`;
            } else {
                modalExtra.innerHTML += `<button class="btn" onclick="liberar(${pos})">Liberar</button>`;
            }
        } else {
            htmlCard += `<p>Dueño: <b>${nombres[prop.owner]}</b></p>`;
            let alqFinal = 0;
            if (esFerrocarril) {
                let transportes = [8, 24, 26, 27];
                let count = transportes.filter(idx => data.propiedades && data.propiedades[idx] && data.propiedades[idx].owner === prop.owner).length;
                let tabla = { 1: 200, 2: 250, 3: 350, 4: 450 };
                alqFinal = tabla[count] || 200;
            } else {
                alqFinal = Math.floor(p.p * porcentajes[prop.nivel || 0] * multClima);
            }
            htmlCard += `<p>Alquiler a pagar: <b>$${alqFinal}</b></p>`;
            if(esCaida && !prop.hipotecada) {
                modalExtra.innerHTML = `<button class="btn" onclick="procesarPago(${miIdx}, ${prop.owner}, ${alqFinal})">Pagar Alquiler</button>`;
            }
        }
        
        htmlCard += `<hr><p style="font-size: 11px;"><b>${esFerrocarril ? "Alquiler según transportes:" : "Precios de Alquiler ("+nombreClima+"): "}</b></p>
                     <ul style="font-size: 11px; padding-left: 20px;">${esFerrocarril ? "<li>Si se poseen: $200</li><li>Si se poseen: $250</li><li>Si se poseen: $350</li><li>Si se poseen: $450</li>" : listaAlquileres}</ul></div>`;
        
        modalText.innerHTML = htmlCard;
        modal.style.display = 'block';
    });
}
    function ejecutarEvento(nombreCasilla) {
        let carta = obtenerCarta();
        db.ref('salas/'+sala+'/jugadores/'+miIdx+'/dinero').transaction(d => {
            let nuevo = Number(d) + carta.v;
            setTimeout(() => verificarBancarrota(miIdx, nuevo), 500);
            return nuevo;
        });
        log(nombres[miIdx] + " cayó en " + nombreCasilla + ": " + carta.txt);
        document.getElementById('modal-title').innerText = nombreCasilla;
        document.getElementById('modal-text').innerText = carta.txt;
        document.getElementById('modal-extra').innerHTML = ""; 
        document.getElementById('modal').style.display = 'block';
    }

    function procesarPago(d, a, m, esEvasionLog = false) {
        db.ref('salas/' + sala + '/jugadores').transaction(j => {
            if(!j) return;
            j[d].dinero = Number(j[d].dinero) - m;
            j[a].dinero = Number(j[a].dinero) + m;
            setTimeout(() => { db.ref('salas/' + sala + '/jugadores/' + d + '/dinero').once('value', s => verificarBancarrota(d, s.val())); }, 500);
            return j;
        });
        if(!esEvasionLog) log(nombres[d] + " pagó $" + m + " a " + nombres[a]);
        alquilerPendiente = null;
        document.getElementById('modal').style.display = 'none';
    }

    function comprar(pos) { 
    log(nombres[miIdx] + " compró " + mapa[pos].n); 
    db.ref('salas/' + sala + '/propiedades/' + pos).set({owner: miIdx, nivel: 0, hipotecada: false}); 
    db.ref('salas/' + sala + '/jugadores/' + miIdx + '/dinero').transaction(d => Number(d) - Number(mapa[pos].p)); 
    
    // --- LLAMADAS A LAS MISIONES ---
    // Verificamos si con esta compra llegó a 3 propiedades
    verificarMisionInversor(miIdx);
    
    // Verificamos si con esta compra completó algún set de colores
    verificarMisionColeccionista(miIdx);
    
    // Verificamos si completó los sets más caros
    verificarMisionMonopolioTotal(miIdx);

        // El jugador que realiza la acción es siempre miIdx
    verificarMisionMonopolioTotal(miIdx);
    
    document.getElementById('modal').style.display = 'none'; 
}
    function mejorar(pos) {
    db.ref('salas/' + sala).once('value', snap => {
        let data = snap.val();
        let grupo = obtenerGrupo(pos);
        let prop = data.propiedades ? data.propiedades[pos] : null;

        // Validar que el jugador posee todas las propiedades del grupo
        let todasPropias = grupo.indices.every(idx => 
            data.propiedades && 
            data.propiedades[idx] && 
            data.propiedades[idx].owner === miIdx
        );

        if (!todasPropias) {
            document.getElementById('modal-title').innerText = "¡Acción Bloqueada!";
            document.getElementById('modal-text').innerText = "Necesitas ser dueño de todas las propiedades del mismo grupo para construir.";
            document.getElementById('modal').style.display = 'block';
            return;
        }

        // Si pasa la validación, procedemos a mejorar
        if (prop.nivel < 5) {
            db.ref('salas/' + sala + '/jugadores/' + miIdx + '/dinero').transaction(d => {
                if (d >= 50) {
                    // Actualizamos el nivel en la propiedad
                    db.ref('salas/' + sala + '/propiedades/' + pos + '/nivel').set(prop.nivel + 1);
                    log(nombres[miIdx] + " mejoró " + mapa[pos].n + " al nivel " + (prop.nivel + 1));
                    cerrarModal();
                    return d - 50;
                } else {
                    alert("No tienes suficiente dinero.");
                    return d;
                }
            });
        }
    });
}
    
    window.tirarDado = function() {
    if(miIdx === -1) return;
    
    db.ref('salas/' + sala).once('value', snap => {
        let s = snap.val(); 
        if(!s || s.turno !== miIdx) return; // Solo el jugador del turno tira
        
        // --- GESTIÓN DE CÁRCEL ---
        if (s.jugadores[miIdx].enCarcel > 0) {
            log(nombres[miIdx] + " intenta salir de la cárcel...");
            // Aquí deberías tener una lógica de "sacar dobles" o pagar fianza
            // Si no logras salir, pasas turno:
            pasarTurno(); 
            return;
        }
        
        // 1. Lógica de clima
        if (s.clima === undefined) {
            let climaInicial = Math.floor(Math.random() * climas.length);
            db.ref('salas/' + sala + '/clima').set(climaInicial);
        }

        // 2. Cálculo del dado
        let dado = Math.floor(Math.random() * 6) + 1;
        document.getElementById('dado-valor').innerText = dado;
        let contadorActual = s.jugadores[miIdx].seisSeguidos || 0;
        let nuevoContador = (dado === 6) ? contadorActual + 1 : 0;

        // 3. Movimiento
        let posActual = Number(s.jugadores[miIdx].pos);
        let nuevaPos = (posActual + dado) % mapa.length;
        
        if (nuevaPos < posActual) { 
            db.ref('salas/'+sala+'/jugadores/'+miIdx+'/dinero').transaction(d => d + 200); 
            log(nombres[miIdx] + " pasó por SALIDA y cobró $200."); 
        }

        // 4. Lógica de Penalización o Movimiento
        if (nuevoContador === 3) {
            log("¡ACUSACIÓN DE FRAUDE! " + nombres[miIdx] + " sacó tres 6 seguidos.");
            db.ref('salas/' + sala + '/jugadores/' + miIdx).update({ 
                pos: 8, enCarcel: 2, seisSeguidos: 0 
            });
            pasarTurno(); // Forzamos el paso de turno al ser sancionado
        } else {
            db.ref('salas/' + sala + '/jugadores/' + miIdx).update({ 
                pos: nuevaPos, seisSeguidos: nuevoContador 
            });

            if (dado === 6) {
                log("¡Sacaste un 6! Tienes turno extra.");
                // No pasamos turno, el jugador vuelve a tirar
            } else {
                pasarTurno(); // Turno normal
            }
            setTimeout(() => manejarCasilla(nuevaPos), 600);
        }
    }); 
}                           
                                                                                                       
    function pagarPrestamo() { db.ref('salas/' + sala + '/jugadores/' + miIdx).once('value', snap => { let j = snap.val(); if (j.tienePrestamo) { if (j.dinero >= j.montoPrestamo) { db.ref('salas/' + sala + '/jugadores/' + miIdx).update({ dinero: firebase.database.ServerValue.increment(-j.montoPrestamo), tienePrestamo: false, montoPrestamo: 0 }); log(nombres[miIdx] + " liquidó su préstamo."); } else { document.getElementById('modal-title').innerText = "Fondos insuficientes"; document.getElementById('modal-text').innerHTML = `<div class="empty-debt">No tienes suficiente dinero para pagar el préstamo.</div>`; document.getElementById('modal-extra').innerHTML = ""; document.getElementById('modal').style.display = 'block'; } } else { document.getElementById('modal-title').innerText = "Banco"; document.getElementById('modal-text').innerHTML = `<div class="empty-debt">No tienes préstamos pendientes.</div>`; document.getElementById('modal-extra').innerHTML = ""; document.getElementById('modal').style.display = 'block'; } }); }
    function verSaldos() { db.ref('salas/' + sala + '/jugadores').once('value', snap => { let txt = ""; snap.forEach(c => { txt += nombres[parseInt(c.key)] + ": $" + c.val().dinero + "<br>"; }); document.getElementById('modal-title').innerText = "Saldos"; document.getElementById('modal-text').innerHTML = txt; document.getElementById('modal').style.display = 'block'; }); }
    function enviarChat() { 
    let input = document.getElementById('chat-msg');
    let msg = input.value; 
    if (msg.trim() === "") return; // No enviar si está vacío

    // Obtenemos la hora actual (HH:MM)
    let ahora = new Date();
    let hora = ahora.getHours().toString().padStart(2, '0');
    let minutos = ahora.getMinutes().toString().padStart(2, '0');
    let marcaTiempo = hora + ":" + minutos;
    
    // Enviamos el mensaje con la hora (t)
    db.ref('salas/' + sala + '/chat').push({ 
        n: nombres[miIdx], 
        m: msg,
        t: marcaTiempo 
    }); 
    
    input.value = ""; // Limpiar input
}
    window.sincronizar = function() {
    escucharOfertas();
    
    // 1. Sincronización del Chat
    db.ref('salas/' + sala + '/chat').on('value', snap => {
        let chatLog = document.getElementById('chat-log');
        if (!chatLog) return;
        chatLog.innerHTML = ""; 
        snap.forEach(msgSnap => {
            let m = msgSnap.val();
            let hora = m.t ? `<small style="color:gray;">[${m.t}]</small> ` : "";
            chatLog.innerHTML += `<div>${hora}<b>${m.n}:</b> ${m.m}</div>`;
        });
        chatLog.scrollTop = chatLog.scrollHeight;
    });

    // 2. Sincronización del Juego (Turnos, Posiciones y Propiedades)
    db.ref('salas/' + sala).on('value', snap => { 
        let s = snap.val(); 
        if(!s) return; 

        // Actualizar dinero
        if (s.jugadores && s.jugadores[miIdx]) {
            document.getElementById('dinero-mio').innerText = s.jugadores[miIdx].dinero;
        }

        // --- CORRECCIÓN DE TURNOS ---
        // Verificamos que el turno exista antes de intentar mostrarlo
        let turnoText = document.getElementById('turno-text');
        if (turnoText && s.turno !== undefined && nombres) {
            turnoText.innerText = "Turno: " + (nombres[s.turno] || "Jugador " + (s.turno + 1));
        }

        // Actualizar Clima
        if(s.clima !== undefined) { 
            let c = climas[s.clima]; 
            document.getElementById('clima-display').innerText = "Estación: " + c.n; 
        }

        // Actualizar Fichas de jugadores
        if (s.jugadores) {
            s.jugadores.forEach((j, i) => { 
                let el = document.getElementById('p' + i); 
                if (el && j) {
                    el.style.display = 'block'; 
                    let cell = document.getElementById('cell-' + j.pos); 
                    if (cell) {
                        el.style.left = (cell.offsetLeft + 30) + 'px'; 
                        el.style.top = (cell.offsetTop + 30) + 'px';
                    }
                }
            });
        }

        // Actualizar Propiedades (Colores y casas)
        if(s.propiedades) { 
            Object.keys(s.propiedades).forEach(pos => { 
                let cell = document.getElementById('cell-' + pos);
                if(cell) {
                    // Actualizar dueño
                    if (typeof colores !== 'undefined') {
                        cell.style.backgroundColor = s.propiedades[pos].hipotecada ? "#ccc" : colores[s.propiedades[pos].owner];
                    }
                    // Actualizar casas/hoteles
                    let hc = cell.querySelector('.house-container'); 
                    if (hc) {
                        hc.innerHTML = "";
                        let nivel = s.propiedades[pos].nivel || 0;
                        if(nivel > 0 && nivel < 5) { for(let i=0; i<nivel; i++) { let h = document.createElement('div'); h.className = 'house'; hc.appendChild(h); } }
                        else if(nivel === 5) { let h = document.createElement('div'); h.className = 'hotel'; hc.appendChild(h); }
                    }
                }
            }); 
        }

        // Actualizar Log
        if(s.log) { 
            let h = ""; Object.values(s.log).forEach(l => h += l + "<br>"); 
            document.getElementById('log').innerHTML = h; 
        }

        // Misiones (Mantenemos tu lógica existente)
        if (s.jugadores && s.jugadores[miIdx]) {
            verificarMisionCajaFuerte(miIdx, s.jugadores[miIdx].dinero);
            if (s.jugadores[miIdx].ultimaMision) {
                let m = s.jugadores[miIdx].ultimaMision;
                const mensajes = {
                    "negociador": "¡Has ganado $400 por tu primer intercambio!",
                    "inversor": "¡Felicidades! Has ganado $200 por ser un Inversor Inicial.",
                    "coleccionista": "¡Felicidades! Has ganado $300 por completar un set de color.",
                    "cajafuerte": "¡Felicidades! Has acumulado $2,000. ¡Un premio de $650 irá directo a tu caja fuerte!",
                    "intocable": "¡El Intocable! Otros jugadores han caído 5 veces en tus propiedades. ¡Has ganado $400!",
                    "renovador": "¡Excelente constructor! Has construido 5 casas en total. ¡Has ganado $500!",
                    "monopolioTotal": "¡INCREÍBLE! Has conseguido el Monopolio Total. ¡Premio de $1,500!"
                };
                if (mensajes[m]) {
                    mostrarNotificacionMision(mensajes[m]);
                    db.ref('salas/' + sala + '/jugadores/' + miIdx + '/ultimaMision').remove();
                }
            }
        }
    });
}
     
    window.addEventListener('DOMContentLoaded', () => {
    const board = document.getElementById('board');
    if (!board) return;

    mapa.forEach((m, i) => { 
        const d = document.createElement('div'); 
        d.className = 'cell'; 
        d.id = 'cell-' + i; 
        d.onclick = () => verPropiedad(i);
        
        let g = obtenerGrupo(i);
        
        // Estilo según grupo
        if (g && g.color === "#f5f5dc") {
            d.style.border = "3px solid #f5f5dc"; 
            d.style.backgroundColor = "#fffef0";
        } else if (g) {
            d.innerHTML = `<div class="strip" style="background: ${g.color}"></div>`;
        }
        
        // Agregar texto
        d.innerHTML += `<div class="contenido" style="font-size: 7px; color: #c71585;">
                            ${m.n}<br>
                            ${m.p > 0 ? '$' + m.p : ''}
                        </div>`;
        board.appendChild(d);
    });
});
</script>
