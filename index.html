<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monopoly Naeun Town</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { background: #fff0f3; font-family: 'Montserrat', sans-serif; display: flex; justify-content: center; padding: 20px; color: #c71585; }
        .container { display: flex; gap: 25px; }
        .board { 
            display: grid; 
            grid-template-columns: repeat(11, 60px); 
            grid-template-rows: repeat(11, 60px); 
            gap: 1px; 
            background: #ffccd5; 
            padding: 5px; 
            border-radius: 5px;
        }
        .cell { 
            width: 60px; height: 60px; font-size: 8px; background: white; 
            position: relative; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; text-align: center; border: 0.5px solid #ffccd5;
        }
        /* Definición de celdas según el layout de Monopoly */
        /* Inferior (Derecha a Izquierda) */
        #cell-0 { grid-column: 11; grid-row: 11; }
        #cell-1 { grid-column: 10; grid-row: 11; }
        #cell-2 { grid-column: 9; grid-row: 11; }
        #cell-3 { grid-column: 8; grid-row: 11; }
        #cell-4 { grid-column: 7; grid-row: 11; }
        #cell-5 { grid-column: 6; grid-row: 11; }
        #cell-6 { grid-column: 5; grid-row: 11; }
        #cell-7 { grid-column: 4; grid-row: 11; }
        #cell-8 { grid-column: 3; grid-row: 11; }
        #cell-9 { grid-column: 2; grid-row: 11; }
        #cell-10 { grid-column: 1; grid-row: 11; }
        /* Izquierdo (Abajo a Arriba) */
        #cell-11 { grid-column: 1; grid-row: 10; }
        #cell-12 { grid-column: 1; grid-row: 9; }
        #cell-13 { grid-column: 1; grid-row: 8; }
        #cell-14 { grid-column: 1; grid-row: 7; }
        #cell-15 { grid-column: 1; grid-row: 6; }
        #cell-16 { grid-column: 1; grid-row: 5; }
        #cell-17 { grid-column: 1; grid-row: 4; }
        #cell-18 { grid-column: 1; grid-row: 3; }
        #cell-19 { grid-column: 1; grid-row: 2; }
        #cell-20 { grid-column: 1; grid-row: 1; }
        /* Superior (Izquierda a Derecha) */
        #cell-21 { grid-column: 2; grid-row: 1; }
        #cell-22 { grid-column: 3; grid-row: 1; }
        #cell-23 { grid-column: 4; grid-row: 1; }
        #cell-24 { grid-column: 5; grid-row: 1; }
        #cell-25 { grid-column: 6; grid-row: 1; }
        #cell-26 { grid-column: 7; grid-row: 1; }
        #cell-27 { grid-column: 8; grid-row: 1; }
        #cell-28 { grid-column: 9; grid-row: 1; }
        #cell-29 { grid-column: 10; grid-row: 1; }
        #cell-30 { grid-column: 11; grid-row: 1; }
        /* Derecho (Arriba a Abajo) */
        #cell-31 { grid-column: 11; grid-row: 2; }
        #cell-32 { grid-column: 11; grid-row: 3; }
        #cell-33 { grid-column: 11; grid-row: 4; }
        #cell-34 { grid-column: 11; grid-row: 5; }
        #cell-35 { grid-column: 11; grid-row: 6; }
        #cell-36 { grid-column: 11; grid-row: 7; }
        #cell-37 { grid-column: 11; grid-row: 8; }
        #cell-38 { grid-column: 11; grid-row: 9; }
        #cell-39 { grid-column: 11; grid-row: 10; }

        .center-zone { 
            grid-column: 2 / 11; grid-row: 2 / 11; 
            background: #fff5f7; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 1;
        }
        /* ... resto de estilos igual ... */
    </style>
</head>
<body>
    <div class="container">
        <div class="board" id="board">
            <div class="center-zone">
                <div id="turno-text">ESPERANDO...</div>
                <img src="https://i.imgur.com/Nsafzb4.png" style="width:60px; cursor:pointer" onclick="tirarDado()">
            </div>
        </div>
    </div>
    <!-- ... resto del script ... -->
</body>
</html>
