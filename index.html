<!DOCTYPE html>
<html lang="es"><head>
    <meta charset="UTF-8">
    <title>Monopoly Naeun Town</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { background: #fff0f3; font-family: 'Montserrat', sans-serif; display: flex; justify-content: center; padding: 20px; color: #c71585; }
        .container { display: flex; gap: 25px; width: 1000px; }
        .game-column { display: flex; flex-direction: column; gap: 15px; }
        
        /* Tablero reducido */
        .board { display: grid; grid-template-columns: repeat(8, 70px); grid-template-rows: repeat(8, 70px); gap: 5px; background: #ffccd5; padding: 10px; border-radius: 25px; position: relative; justify-content: center; align-content: center; }
        .cell { background: white; border: 2px solid #ffccd5; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 7px; font-weight: bold; color: #c71585; text-align: center; position: relative; cursor: pointer; }
        
        .strip { width: 100%; height: 10px; position: absolute; top: 0; border-top-left-radius: 8px; border-top-right-radius: 8px; }
        .house-container { position: absolute; bottom: 2px; display: flex; gap: 1px; }
        .house { width: 8px; height: 8px; background: #ff59aa; }
        .hotel { width: 20px; height: 8px; background: #c71585; }
        .token { width: 25px; height: 25px; position: absolute; z-index: 10; transition: all 0.5s ease; pointer-events: none; }
        
        /* Zona central ajustada */
        .center-zone { grid-column: 3 / 7; grid-row: 3 / 7; background: #fff5f7; border: 3px dashed #ff80bf; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
        
        .sidebar { width: 320px; display: flex; flex-direction: column; gap: 20px; }
        .panel { background: #fff0f9; padding: 20px; border-radius: 20px; border: 2px solid #ffccd5; }
        .btn { width: 100%; padding: 10px; background: #ff59aa; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin: 5px 0; font-size: 12px; }
        .input-field { width: 93%; padding: 8px; margin: 5px 0; border: 1px solid #ffccd5; border-radius: 8px; }
        #log { height: 125px; overflow-y: auto; font-size: 11px; color: #c71585; padding: 10px; background: white; border-radius: 10px; border: 1px solid #ffccd5; margin-bottom: 10px; }
        #chat-log { height: 125px; overflow-y: auto; font-size: 11px; color: #c71585; padding: 10px; background: white; border-radius: 10px; border: 1px solid #ffccd5; margin-bottom: 10px; }
        #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; background: #ffe4e9; padding: 20px; border: 3px solid #ff80bf; border-radius: 15px; text-align: center; z-index: 999; }
        .card-property { border: 2px solid #c71585; padding: 10px; border-radius: 5px; background: white; margin-bottom: 10px; }
        .card-header { background: #ff80bf; color: white; padding: 5px; font-weight: bold; margin-bottom: 10px; }
        .empty-debt { padding: 10px; background: #fff; border: 1px solid #ff80bf; border-radius: 10px; color: #ff59aa; font-weight: bold; }
        #banco-container { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; background: #fff0f9; border: 2px solid #ffccd5; border-radius: 20px; padding: 15px; gap: 10px; }
        
        #cell-0 { grid-column: 1; grid-row: 1; } #cell-1 { grid-column: 2; grid-row: 1; } #cell-2 { grid-column: 3; grid-row: 1; } #cell-3 { grid-column: 4; grid-row: 1; } #cell-4 { grid-column: 5; grid-row: 1; } #cell-5 { grid-column: 6; grid-row: 1; } #cell-6 { grid-column: 7; grid-row: 1; } #cell-7 { grid-column: 8; grid-row: 1; }
        #cell-8 { grid-column: 8; grid-row: 2; } #cell-9 { grid-column: 8; grid-row: 3; } #cell-10 { grid-column: 8; grid-row: 4; } #cell-11 { grid-column: 8; grid-row: 5; } #cell-12 { grid-column: 8; grid-row: 6; } #cell-13 { grid-column: 8; grid-row: 7; } #cell-14 { grid-column: 8; grid-row: 8; }
        #cell-15 { grid-column: 7; grid-row: 8; } #cell-16 { grid-column: 6; grid-row: 8; } #cell-17 { grid-column: 5; grid-row: 8; } #cell-18 { grid-column: 4; grid-row: 8; } #cell-19 { grid-column: 3; grid-row: 8; } #cell-20 { grid-column: 2; grid-row: 8; } #cell-21 { grid-column: 1; grid-row: 8; }
        #cell-22 { grid-column: 1; grid-row: 7; } #cell-23 { grid-column: 1; grid-row: 6; } #cell-24 { grid-column: 1; grid-row: 5; } #cell-25 { grid-column: 1; grid-row: 4; } #cell-26 { grid-column: 1; grid-row: 3; } #cell-27 { grid-column: 1; grid-row: 2; }
    </style></head><body><audio loop autoplay>
    <source src="https://dl.dropbox.com/scl/fi/5oxzgnxoe30zqd4m6hdfh/kawaii-playlist-for-snack-time-BGM-POP.mp3?rlkey=1lw76u3u1w1ck3dj2ej5x7ml7&st=y6j07iwx&dl=1" type="audio/mpeg"></audio><div class="container">
    <div class="game-column">
        <div class="board" id="board">
            <img src="https://i.imgur.com/FGnMi8Y.png" id="p0" class="token" style="display:none">
            <img src="https://i.imgur.com/fRZJfP8.png" id="p1" class="token" style="display:none">
            <img src="https://i.imgur.com/u2AtssG.png" id="p2" class="token" style="display:none">
            <img src="https://i.imgur.com/ekQp8WL.png" id="p3" class="token" style="display:none">
            <div class="center-zone">
                <div id="clima-display" style="font-size: 10px; color: #ff59aa; font-weight: bold;">Clima: -</div>
                <div id="turno-text" style="font-weight:bold;">ESPERANDO...</div>
                <div id="dado-valor">0</div>
                <img src="https://i.imgur.com/Nsafzb4.png" style="width:60px; cursor:pointer" onclick="tirarDado()">
                <div>💖 $<span id="dinero-mio">1000</span></div>
                <div style="font-size: 8px; margin-top: 5px;">Monto de impuestos actuales: $<span id="monto-impuestos">0</span></div>
            </div>
        </div>
        <div id="banco-container">
            <button class="btn" style="width: 140px" onclick="abrirBanco()">🏦 Banco</button>
            <button class="btn" style="width: 140px" onclick="pagarPrestamo()">💳 Pagar Préstamo</button>
            <button class="btn" style="width: 140px" onclick="verSaldos()">💰 Ver Saldos</button>
            <button class="btn" style="width: 140px; background: #ff59aa;" onclick="abrirIntercambio()">🤝 Intercambiar</button>
        </div>
    </div>
    <div class="sidebar">
        <div class="panel">
            <strong>Unirse a Sala</strong>
            <input type="text" id="sala-id" class="input-field" placeholder="Nombre de la sala">
            <button class="btn" id="btn-unirse" onclick="unirse()">Entrar a la sala</button>
        </div>
        <div class="panel">
            <strong>Historial</strong><div id="log"></div>
            <strong>Chat</strong><div id="chat-log"></div>
            <input type="text" id="chat-msg" class="input-field" placeholder="Mensaje...">
            <button class="btn" onclick="enviarChat()">Enviar</button>
        </div>
    </div></div><div id="modal">
    <h3 id="modal-title"></h3>
    <div id="modal-text"></div>
    <div id="modal-extra"></div>
    <button class="btn" id="btn-cerrar" onclick="cerrarModal()">Cerrar</button></div><script>
    const firebaseConfig = { databaseURL: "https://monopolovely-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let miIdx = -1, sala = "", yaEntro = false;
    const nombres = ["Dog", "Horse", "Hat", "Car"];
    const colores = ["#ffb7b2", "#ffd8a8", "#b2f2bb", "#a5d8ff"];
    
    // Configuración de grupos
    const grupos = [
        {color: "#d1b3ff", indices: [18, 19, 20]}, // LILA: SMENT, YG, YJP
        {color: "#a5d8ff", indices: [22, 23, 24]}, // AZUL BEBÉ: Piscina, Yate, Playa
        {color: "#d7ccc8", indices: [9, 10, 12]},  // MARRÓN PASTEL: Cafetería, Restaurante, Spa
        {color: "#c8e6c9", indices: [26, 27, 28]}, // VERDE PASTEL: Aereopuerto, Tren, Metro
        {color: "#ffcdd2", indices: [13, 14, 15, 16]}, // ROJO PASTEL: Hospital, Cine, Estadio, Teatro
        {color: "#ffe0b2", indices: [5, 7]},       // NARANJA PASTEL: Gangnam, Cheongdam
        {color: "#e1bee7", indices: [1, 3, 4]}     // LILA VARIANTE: Itaewon, Busan, Seocho
    ];

    function obtenerGrupo(pos) { return grupos.find(g => g.indices.includes(pos)); }

    const mapa = [
        {n:"SALIDA",p:0},{n:"ITAEWON",p:100},{n:"ARCA COMUNAL",p:0},{n:"BUSAN",p:200},{n:"SEOCHO",p:250},{n:"GANGNAM",p:300},{n:"?",p:0},{n:"CHEONGDAM",p:400},
        {n:"CÁRCEL",p:0},{n:"CAFETERÍA",p:500},{n:"RESTAURANTE",p:520},{n:"?",p:0},{n:"SPA",p:300},{n:"CINE",p:350},{n:"HOSPITAL",p:400},{n:"TEATRO",p:500},
        {n:"ESTADIO",p:550},{n:"ARCA COMUNAL",p:0},{n:"SMENT",p:600},{n:"YG ENT",p:700},{n:"YJP",p:750},{n:"IMPUESTOS",p:0},{n:"PISCINA PRIVADA",p:800},{n:"YATE",p:900},
        {n:"PLAYA LOCAL",p:950},{n:"PARADA",p:0},{n:"AEREOPUERTO",p:1000},{n:"TREN",p:1200},{n:"METRO",p:1300}
    ];

    // ... [Mantener el resto de tu lógica de climas, eventos, etc. intacta]

    function mejorar(pos) {
        db.ref('salas/' + sala).once('value', snap => {
            let data = snap.val();
            let grupo = obtenerGrupo(pos);
            let todasDelMismoColor = grupo.indices.every(idx => data.propiedades && data.propiedades[idx] && data.propiedades[idx].owner === miIdx);
            
            if (!todasDelMismoColor) {
                alert("Debes completar el set comprando todas las propiedades de este color para poder mejorar.");
                return;
            }
            log(nombres[miIdx] + " mejoró " + mapa[pos].n); 
            db.ref('salas/' + sala + '/propiedades/' + pos + '/nivel').transaction(n => (Number(n) || 0) + 1); 
            db.ref('salas/' + sala + '/jugadores/' + miIdx + '/dinero').transaction(d => Number(d) - 50); 
            document.getElementById('modal').style.display = 'none';
        });
    }

    // Dibujo del tablero actualizado
    mapa.forEach((m, i) => { 
        const d = document.createElement('div'); 
        d.className = 'cell'; d.id = 'cell-' + i; 
        d.onclick = () => verPropiedad(i);
        let g = obtenerGrupo(i);
        let stripStyle = g ? `background: ${g.color};` : 'display:none;';
        d.innerHTML = `<div class="strip" style="${stripStyle}"></div>${m.n}<br>${m.p > 0 ? '$'+m.p : ''}<div class="house-container"></div>`; 
        document.getElementById('board').appendChild(d); 
    });

    // ... [Cierra el resto del script original exactamente como lo tenías]
</script></body></html>
