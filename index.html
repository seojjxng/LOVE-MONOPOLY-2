<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monopoly Naeun Town</title>
</head>
<body>
    
    <script>
    // 1. CONFIGURACIÓN DE COLORES Y GRUPOS
    const colores = ['#ffffff', '#ff9aa2', '#c7ceea', '#b5ead7', '#ffdac1']; // Ajusta según tus jugadores
    const grupos = {
        0: [1, 3, 4], 
        1: [5, 7, 9]  
        // Agrega todos tus sets aquí
    };

    // 2. LÓGICA DE VERIFICACIÓN DE SET
    function verificarSetCompleto(propIdx, ownerIdx, todasLasPropiedades) {
        let grupoID = Object.keys(grupos).find(g => grupos[g].includes(parseInt(propIdx)));
        if (!grupoID) return true; 

        let contadas = 0;
        grupos[grupoID].forEach(idx => {
            if (todasLasPropiedades[idx] && todasLasPropiedades[idx].owner === ownerIdx) {
                contadas++;
            }
        });
        return contadas === 3; 
    }

    // 3. MODAL DE PROPIEDAD CON RESTRICCIÓN
    function verPropiedad(pos) {
        let p = mapa[pos];
        if (p.p === 0) return;
        
        db.ref('salas/' + sala).once('value', snap => {
            let data = snap.val();
            let props = data.propiedades || {};
            let prop = props[pos];
            
            // Limpia el contenedor de botones antes de renderizar
            extra.innerHTML = "";
            
            if (prop && prop.owner === miIdx) {
                let tieneSet = verificarSetCompleto(pos, miIdx, props);
                
                if (!prop.hipotecada) {
                    if (prop.nivel < 5) {
                        if (tieneSet) {
                            extra.innerHTML += `<button class="btn" onclick="mejorar(${pos})">Mejorar ($50)</button>`;
                        } else {
                            extra.innerHTML += `<button class="btn" style="background:#555; color:#fff;" disabled>Set incompleto</button>`;
                        }
                    }
                    extra.innerHTML += `<button class="btn" style="background: #ad0c0c;" onclick="hipotecar(${pos})">Hipotecar</button>`;
                }
            }
        });
    }

    // 4. SINCRO PARA COLORES DE PROPIETARIOS
    function sincronizar(s) {
        if(s.propiedades) { 
            Object.keys(s.propiedades).forEach(pos => { 
                let cell = document.getElementById('cell-' + pos);
                let p = s.propiedades[pos];
                if(cell) {
                    // Si tiene dueño, pinta la celda con el color del jugador, si está hipotecada gris
                    if(p.owner !== undefined) {
                        cell.style.backgroundColor = p.hipotecada ? "#555" : colores[p.owner];
                    }
                }
            }); 
        }
    }
    </script>
</body>
</html>
