<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monopoly Naeun Town</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { background: #fff0f3; font-family: 'Montserrat', sans-serif; display: flex; justify-content: center; padding: 20px; color: #c71585; }
        .container { display: flex; gap: 25px; width: 1200px; }
        .game-column { display: flex; flex-direction: column; gap: 15px; }
        /* Tablero ampliado */
        .board { display: grid; grid-template-columns: repeat(8, 80px); grid-template-rows: repeat(8, 80px); gap: 5px; background: #ffccd5; padding: 10px; border-radius: 25px; position: relative; }
        .cell { background: white; border: 2px solid #ffccd5; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 7px; font-weight: bold; color: #c71585; text-align: center; position: relative; cursor: pointer; }
        .strip { width: 100%; height: 10px; background: #ff80bf; position: absolute; top: 0; border-top-left-radius: 8px; border-top-right-radius: 8px; }
        .house-container { position: absolute; bottom: 2px; display: flex; gap: 1px; }
        .house { width: 8px; height: 8px; background: #ff59aa; }
        .hotel { width: 20px; height: 8px; background: #c71585; }
        .token { width: 25px; height: 25px; position: absolute; z-index: 10; transition: all 0.5s ease; pointer-events: none; }
        .center-zone { grid-column: 3 / 7; grid-row: 3 / 7; background: #fff5f7; border: 3px dashed #ff80bf; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        /* Sidebar y otros estilos se mantienen igual */
        .sidebar { width: 320px; display: flex; flex-direction: column; gap: 20px; }
        .panel { background: #fff0f9; padding: 20px; border-radius: 20px; border: 2px solid #ffccd5; }
        .btn { width: 100%; padding: 10px; background: #ff59aa; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin: 5px 0; font-size: 12px; }
        .input-field { width: 93%; padding: 8px; margin: 5px 0; border: 1px solid #ffccd5; border-radius: 8px; }
        #log, #chat-log { height: 125px; overflow-y: auto; font-size: 11px; color: #c71585; padding: 10px; background: white; border-radius: 10px; border: 1px solid #ffccd5; margin-bottom: 10px; }
        #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; background: #ffe4e9; padding: 20px; border: 3px solid #ff80bf; border-radius: 15px; text-align: center; z-index: 999; }
        #banco-container { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-column">
            <div class="board" id="board">
                <!-- Se generarán dinámicamente -->
                <div class="center-zone">
                    <div id="turno-text" style="font-weight:bold;">ESPERANDO...</div>
                    <div id="dado-valor">0</div>
                    <img src="https://i.imgur.com/Nsafzb4.png" style="width:50px; cursor:pointer" onclick="tirarDado()">
                    <div>💖 $<span id="dinero-mio">1000</span></div>
                </div>
            </div>
            <div id="banco-container">
                <button class="btn" onclick="abrirBanco()">🏦 Banco</button>
                <button class="btn" onclick="pagarPrestamo()">💳 Pagar Préstamo</button>
                <button class="btn" onclick="verSaldos()">💰 Ver Saldos</button>
            </div>
        </div>
        <div class="sidebar">
            <div class="panel">
                <strong>Unirse a Sala</strong>
                <input type="text" id="sala-id" class="input-field" placeholder="Nombre de la sala">
                <button class="btn" id="btn-unirse" onclick="unirse()">Entrar</button>
            </div>
            <div class="panel">
                <strong>Historial</strong><div id="log"></div>
                <strong>Chat</strong><div id="chat-log"></div>
                <input type="text" id="chat-msg" class="input-field" placeholder="Mensaje...">
                <button class="btn" onclick="enviarChat()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        // Configuración ampliada a 30 casillas
        const mapa = [
            {n:"SALIDA",p:0}, {n:"IGLESIA",p:100}, {n:"?",p:0}, {n:"BOUTIQUE",p:200}, {n:"CAFÉ",p:150},
            {n:"PARQUE",p:120}, {n:"CHEONGDAM",p:500}, {n:"GANGNAM",p:520}, {n:"SEOCHO-GU",p:250}, {n:"MAPO",p:300},
            {n:"INCHEON",p:350}, {n:"JOYAS",p:400}, {n:"CÁRCEL",p:0}, {n:"IMPUESTOS",p:0}, {n:"ESTUDIO",p:220},
            {n:"?",p:0}, {n:"ARCA",p:0}, {n:"BUKCHON",p:500}, {n:"HOTEL",p:600}, {n:"CINE",p:280},
            {n:"MUSEO",p:310}, {n:"GALERÍA",p:330}, {n:"METRO",p:200}, {n:"BIBLIOTECA",p:180}, {n:"CLUB",p:450},
            {n:"RESTAURANTE",p:400}, {n:"TIENDA",p:250}, {n:"A LA CÁRCEL",p:0}, {n:"CENTRO",p:550}, {n:"PLAZA",p:350}
        ];

        // ... (Mantén toda la lógica de funciones existente aquí: unirse, tirarDado, etc.)
        // La lógica actual ya usa "mapa.length", por lo que al cambiar el array, todo se ajustará automáticamente.

        // Generación dinámica del tablero
        mapa.forEach((m, i) => {
            const d = document.createElement('div');
            d.className = 'cell'; d.id = 'cell-' + i;
            d.onclick = () => verPropiedad(i);
            d.innerHTML = `<div class="strip"></div>${m.n}<br>${m.p > 0 ? '$'+m.p : ''}<div class="house-container"></div>`;
            document.getElementById('board').appendChild(d);
        });

        // Asegúrate de incluir el resto de tus funciones JavaScript aquí tal cual las tenías.
    </script>
</body>
</html>
