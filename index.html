<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monopoly Naeun Town</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { background: #fff0f3; font-family: 'Montserrat', sans-serif; display: flex; justify-content: center; padding: 20px; color: #c71585; }
        .container { display: flex; gap: 25px; width: 1000px; }
        .game-column { display: flex; flex-direction: column; gap: 15px; }
        
        /* Tablero */
        .board {
            display: grid;
            grid-template-columns: repeat(4, 150px);
            grid-template-rows: repeat(4, 150px);
            width: 600px;
            height: 600px;
            border: 2px solid #ff80bf;
            background: white;
            position: relative;
        }
        .cell { border: 1px solid #ffccd5; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
        
        /* Elementos del juego */
        .token { width: 35px; height: 35px; position: absolute; z-index: 10; transition: all 0.5s ease; pointer-events: none; }
        .center-zone { grid-column: 2 / 4; grid-row: 2 / 4; background: #fff5f7; border: 3px dashed #ff80bf; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* Paneles */
        .sidebar { width: 320px; display: flex; flex-direction: column; gap: 20px; }
        .panel { background: #fff0f9; padding: 20px; border-radius: 20px; border: 2px solid #ffccd5; }
        .btn { width: 100%; padding: 10px; background: #ff59aa; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin: 5px 0; }
        .input-field { width: 90%; padding: 8px; margin: 5px 0; border: 1px solid #ffccd5; border-radius: 8px; }
        #log, #chat-log { height: 100px; overflow-y: auto; font-size: 11px; background: white; padding: 5px; border: 1px solid #ffccd5; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="game-column">
        <div class="board" id="board">
            <!-- Los tokens se posicionarán aquí -->
            <img src="https://i.imgur.com/FGnMi8Y.png" id="p0" class="token" style="display:none">
            <div class="center-zone">
                <div id="turno-text">ESPERANDO...</div>
                <img src="https://i.imgur.com/Nsafzb4.png" style="width:50px; cursor:pointer" onclick="tirarDado()">
            </div>
        </div>
        <div id="banco-container">
            <button class="btn" onclick="abrirBanco()">🏦 Banco</button>
        </div>
    </div>
    
    <div class="sidebar">
        <div class="panel">
            <strong>Unirse</strong>
            <input type="text" id="sala-id" class="input-field" placeholder="Nombre sala">
            <button class="btn" id="btn-unirse" onclick="unirse()">Entrar</button>
        </div>
        <div class="panel">
            <strong>Historial</strong><div id="log"></div>
            <strong>Chat</strong><div id="chat-log"></div>
        </div>
    </div>
</div>

<script>
    // Inicialización y mapa corregidos
    const mapa = [{n:"SALIDA"},{n:"IGLESIA"},{n:"?"},{n:"BOUTIQUE"},{n:"CÁRCEL"},{n:"CHEONGDAM"},{n:"GANGNAM"},{n:"SEOCHO"},{n:"MAPO"},{n:"INCHEON"},{n:"JOYAS"},{n:"EVENTO"},{n:"IMPUESTOS"},{n:"ARCA"},{n:"BUKCHON"},{n:"FIN"}];
    const boardElement = document.getElementById('board');

    // Generar celdas correctamente
    mapa.forEach((casilla, i) => {
        const d = document.createElement('div');
        d.className = 'cell';
        d.id = 'cell-' + i;
        d.innerHTML = `<div>${casilla.n}</div><div class="house-container"></div>`;
        boardElement.appendChild(d);
    });

    // ... (El resto de tu lógica de Firebase y funciones va aquí)
    console.log("Tablero generado correctamente.");
</script>
</body>
</html>
