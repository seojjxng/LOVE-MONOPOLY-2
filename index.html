<div id="modal-misiones" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 350px; background: #ffe4e9; padding: 20px; border: 3px solid #ff80bf; border-radius: 15px; text-align: center; z-index: 1000;">

        <button class="btn" id="btn-cerrar" onclick="cerrarModal()">Cerrar</button>
    </div><script>
    const firebaseConfig = { databaseURL: "https://monopolovely-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let miIdx = -1, sala = "", yaEntro = false;
    const nombres = ["Dog", "Horse", "Hat", "Car"];
    const colores = ["#ffb7b2", "#ffd8a8", "#b2f2bb", "#a5d8ff"];

        // Configuración de colores por grupo
    const grupos = [
        {color: "#ff80bf", indices: [1, 3, 4, 5]},
        {color: "#a5d8ff", indices: [7, 9, 10, 12]},
        {color: "#b2f2bb", indices: [13, 14, 15, 16]},
        {color: "#ffd8a8", indices: [18, 19, 20, 22]},
        {color: "#eebafa", indices: [23, 24, 26, 27]}
    ];

        function obtenerGrupo(pos) {
    return grupos.find(g => g.indices.includes(pos));
}
        
    const mapa = [
        {n:"SALIDA",p:0},{n:"ITAEWON",p:100},{n:"ARCA COMUNAL",p:0},{n:"BUSAN",p:200},{n:"SEOCHO",p:250},{n:"GANGNAM",p:300},{n:"?",p:0},{n:"CHEONGDAM",p:400},
        {n:"CÁRCEL",p:0},{n:"CAFETERÍA",p:500},{n:"RESTAURANTE",p:520},{n:"?",p:0},{n:"SPA",p:300},{n:"CINE",p:350},{n:"HOSPITAL",p:400},{n:"TEATRO",p:500},
        {n:"ESTADIO",p:550},{n:"ARCA COMUNAL",p:0},{n:"SMENT",p:600},{n:"YG ENT",p:700},{n:"YJP",p:750},{n:"IMPUESTOS",p:0},{n:"PISCINA PRIVADA",p:800},{n:"YATE",p:900},
        {n:"PLAYA LOCAL",p:950},{n:"PARADA",p:0},{n:"AEREOPUERTO",p:1000},{n:"TREN",p:1200},{n:"METRO",p:1300}
    ];

    // Variables de clima ampliadas
   const climas = [
        {n: "Primavera Soleada", mult: 1.0}, {n: "Primavera Lluviosa", mult: 1.0},
        {n: "Verano Caluroso", mult: 1.0}, {n: "Verano Nublado", mult: 1.0},
        {n: "Otoño Fresco", mult: 1.0}, {n: "Otoño Ventoso", mult: 1.0},
        // Climas adversos que reducen alquiler (porcentaje azar entre 50% y 80%)
        {n: "Lluvia Fuerte", mult: 0.7}, 
        {n: "Tormenta Eléctrica", mult: 0.5},
        {n: "Ventisca", mult: 0.6}, 
        {n: "Nevada Intensa", mult: 0.6},
        {n: "Tornado", mult: 0.5}
    ];

    function iniciarRelojClima() {
        setInterval(() => {
            let nuevoClima = Math.floor(Math.random() * climas.length);
            db.ref('salas/' + sala + '/clima').set(nuevoClima);
            log("¡El clima ha cambiado a " + climas[nuevoClima].n + "!");
        }, 600000);
    }

    let alquilerPendiente = null;
    let turnosSeis = 0;
    const cartasEvento = [
        {txt: "¡Inversión exitosa! Cobras $200", v: 200},
        {txt: "¡Olvidaste pagar la factura de luz! Pagas $250 por mora", v: -250},
        {txt: "¡Premio de certamen de belleza! Cobras $100", v: 100},
        {txt: "¡Reparaciones en casa! Pagas $150", v: -150},
        {txt: "¡Multa por exceso de velocidad! Pagas $350", v: -350},
        {txt: "¡Encontraste $60 en la calle! Cobras $60", v: 60},
        {txt: "¡Dividendos bancarios! Cobras $50", v: 50},
        {txt: "¡Multa por exceso de velocidad! Pagas $100", v: -100},
        {txt: "¡Venta de activos! Cobras $250", v: 250},
        {txt: "¡Gastos médicos de la abuela! Pagas $200", v: -200},
        {txt: "¡Bono de Naeun Town! Cobras $150", v: 150},
        {txt: "¡Impuesto de lujo! Pagas $100", v: -100},
        {txt: "¡Heredaste una cuantiosa suma de la tía de una tía! Recibes $150", v: 150}
    ];

    function obtenerCarta() { return cartasEvento[Math.floor(Math.random() * cartasEvento.length)]; }
    function cerrarModal() { document.getElementById('modal').style.display = 'none'; document.getElementById('modal-extra').innerHTML = ""; }
    function log(txt) { db.ref('salas/' + sala + '/log').push(txt); }

        function gestionarFraude() {
    let extra = document.getElementById('modal-extra');
    document.getElementById('modal-title').innerText = "Corte Penal";
    
    let htmlContent = `
        <div class="card-property">
            <p>Has sido acusado de <b>FRAUDE</b> por acumular tres 6 seguidos.</p>
            <p>Debes pagar una penalidad o esperar un turno en la cárcel.</p>
            <button class="btn" onclick="pagarPenalidad()">Pagar $150</button>
            <button class="btn" style="background:#555" onclick="cerrarModal()">Esperar turno</button>
        </div>
    `;
    document.getElementById('modal-text').innerHTML = htmlContent;
    extra.innerHTML = ""; // Limpiamos botones extra
    document.getElementById('modal').style.display = 'block';
}

function pagarPenalidad() {
    db.ref('salas/' + sala + '/jugadores/' + miIdx).update({ enCarcel: 0 });
    db.ref('salas/' + sala + '/jugadores/' + miIdx + '/dinero').transaction(d => d - 150);
    log(nombres[miIdx] + " pagó la multa de fraude y fue liberado.");
    cerrarModal();
}
    
    function unirse() { 
        if(yaEntro) return;
        sala = document.getElementById('sala-id').value; 
        if(!sala) return;
        yaEntro = true;
        document.getElementById('btn-unirse').disabled = true;
        db.ref('salas/' + sala + '/jugadores').once('value', snap => { 
            miIdx = snap.numChildren(); 
            db.ref('salas/' + sala + '/jugadores/' + miIdx).set({ pos: 0, dinero: 1000, enCarcel: 0, tienePrestamo: false, montoPrestamo: 0 }); 
            if(miIdx == 0) { db.ref('salas/' + sala + '/turno').set(0); iniciarRelojClima(); }
            db.ref('salas/' + sala + '/chat').push({ n: "Sistema", m: nombres[miIdx] + " ha entrado a la sala." });
            sincronizar(); 
        }); 
    }

        function abrirModalMisiones() {
    db.ref('salas/' + sala + '/jugadores/' + miIdx + '/misionesCumplidas').once('value', snap => {
        let completadas = snap.val() || {};
        let lista = document.getElementById('lista-misiones');
        lista.innerHTML = ""; // Limpiar lista anterior

        const misiones = [
    { id: 'inversorInicial', titulo: 'Inversor Inicial. Poseer al menos 3 propiedades.', rec: 200 },
    { id: 'coleccionista', titulo: 'El coleccionista. Completar cualquier set de color.', rec: 300 },
    { id: 'negociador', titulo: 'El negociador. Por realizar tu primer intercambio exitoso.', rec: 400 },
    { id: 'cajafuerte', titulo: 'Caja fuerte. Acumular $2,000 en efectivo.', rec: 650 },
    { id: 'renovador', titulo: 'Renovador. Construir un total de 5 casas.', rec: 500 },
    { id: 'monopolioTotal', titulo: 'Monopolio total. Ser dueño de los 3 sets más caros.', rec: 1500 },
    { id: 'intocable', titulo: 'El intocable. Otros jugadores caen 5 veces en tus propiedades.', rec: 400 }
];

        misiones.forEach(m => {
            let item = document.createElement('li');
           item.innerHTML = `${m.titulo} - <b>$${m.rec}</b> ${completadas[m.id] ? '✅' : ''}`;
            lista.appendChild(item);
        });

        document.getElementById('modal-misiones').style.display = 'block';
    });
}

function mostrarNotificacionMision(titulo) {
    document.getElementById('msg-mision').innerText = titulo;
    document.getElementById('modal-mision-completada').style.display = 'block';
}

        function verificarMisionNegociador(jugadorIdx) {
    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/misionesCumplidas/negociador').once('value', snap => {
        if (!snap.val()) {
            // 1. Marcar como completada en BD
            db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/misionesCumplidas/negociador').set(true);
            
            // 2. Entregar recompensa
            db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/dinero').transaction(d => d + 400);
            
            // 3. Registrar el logro para que el cliente lo detecte
            db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/ultimaMision').set("negociador");
            
            log(nombres[jugadorIdx] + " completó la misión: El negociador.");
        }
    }); // <--- Aquí se cierra correctamente el .once
}

        function verificarMisionInversor(jugadorIdx) {
    db.ref('salas/' + sala).once('value', snap => {
        let data = snap.val();
        if (!data.propiedades) return;

        // Contamos cuántas propiedades tienen como owner al jugador actual
        let totalPropiedades = Object.values(data.propiedades).filter(p => p.owner === jugadorIdx).length;

        if (totalPropiedades >= 3) {
            db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/misionesCumplidas/inversorInicial').once('value', snap => {
                if (!snap.val()) { // Solo si no la ha cumplido antes

                    // 1. Marcar como cumplida en BD
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/misionesCumplidas/inversorInicial').set(true);
                    
                    // 2. Entregar recompensa
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/dinero').transaction(d => d + 200);
                    
                    // 3. Registrar el logro para que sincronizar() lo detecte
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/ultimaMision').set("inversor");
                    
                    log(nombres[jugadorIdx] + " completó la misión: Inversor Inicial.");
                }
            }); // <--- Cierra el .once de misionesCumplidas
        } // <--- Cierra el if (totalPropiedades >= 3)
    }); // <--- Cierra el .once de salas/sala
}

        function verificarMisionColeccionista(jugadorIdx) {
    db.ref('salas/' + sala).once('value', snap => {
        let data = snap.val();
        if (!data.propiedades) return;

        // Revisamos cada grupo de color definido en tu array 'grupos'
        let tieneSetCompleto = grupos.some(g => {
            return g.indices.every(idx => 
                data.propiedades[idx] && data.propiedades[idx].owner === jugadorIdx
            );
        });

        if (tieneSetCompleto) {
            db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/misionesCumplidas/coleccionista').once('value', snap => {
                if (!snap.val()) { // Si no la ha cumplido aún
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/misionesCumplidas/coleccionista').set(true);
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/dinero').transaction(d => d + 300);
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/ultimaMision').set("coleccionista");
                    log(nombres[jugadorIdx] + " completó la misión: El coleccionista.");
                }
            });
        }
    });
}

        function verificarMisionMonopolioTotal(jugadorIdx) {
    db.ref('salas/' + sala + '/propiedades').once('value', snap => {
        let propiedades = snap.val();
        if (!propiedades) return;

        // Debes definir aquí los IDs de los grupos más caros (ejemplo: grupos 6, 7 y 8)
        // Ajusta los números según tu array de 'grupos'
        const setsMasCaros = [6, 7, 8]; 

        let tieneTodosLosSets = setsMasCaros.every(grupoIdx => {
            return grupos[grupoIdx].indices.every(pIdx => 
                propiedades[pIdx] && propiedades[pIdx].owner === jugadorIdx
            );
        });

        if (tieneTodosLosSets) {
            db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/misionesCumplidas/monopolioTotal').once('value', snap => {
                if (!snap.val()) { // Solo si no se ha reclamado
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/misionesCumplidas/monopolioTotal').set(true);
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/dinero').transaction(d => d + 1500);
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/ultimaMision').set("monopolioTotal");
                    
                    log(nombres[jugadorIdx] + " completó la misión: ¡Monopolio Total!");
                }
            });
        }
    });
}

        function verificarMisionRenovador(jugadorIdx) {
    db.ref('salas/' + sala + '/propiedades').once('value', snap => {
        let propiedades = snap.val();
        if (!propiedades) return;

        // Sumamos el nivel de todas las propiedades del jugador
        let totalCasas = Object.values(propiedades)
            .filter(p => p.owner === jugadorIdx)
            .reduce((sum, p) => sum + (p.nivel || 0), 0);

        if (totalCasas >= 5) {
            db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/misionesCumplidas/renovador').once('value', snap => {
                if (!snap.val()) { // Solo si no la ha cumplido
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/misionesCumplidas/renovador').set(true);
                    db.ref('salas/' + sala + '/jugadores/' + jugadorIdx + '/dinero').transaction(d => d + 500);

        db.ref('salas/' + sala).once('value', snap => {
            let data = snap.val();
            let misProps = [];
            if(data.propiedades) {
                Object.keys(data.propiedades).forEach(pIdx => {
                    if(data.propiedades[pIdx].owner === miIdx) misProps.push(pIdx);
                });
            }
            document.getElementById('modal-title').innerText = "Revender Propiedad";
            let html = "Selecciona propiedad y comprador:<br>";

            else {
                misProps.forEach(pIdx => {

                    html += `<br><b>${p.n}</b> ($${p.p}): <select id="sel-${pIdx}">`;
                    data.jugadores.forEach((j, i) => { if(i !== miIdx) html += `<option value="${i}">${nombres[i]}</option>`; });

            let o = snap.val();

                document.getElementById('modal-title').innerText = "¡Oferta de compra!";

    function confirmarCompra(oKey) {
        db.ref('salas/' + sala + '/ofertas/' + oKey).once('value', snap => {
            let o = snap.val();
            db.ref('salas/' + sala + '/jugadores').transaction(j => {
                if(j[miIdx].dinero >= o.precio) {
                    j[miIdx].dinero -= o.precio;
                    j[o.de].dinero += o.precio;
                    return j;
                }
                return;
            });


           // 1. Misiones de Propiedades
        verificarMisionInversor(miIdx);
        verificarMisionColeccionista(miIdx);
        verificarMisionMonopolioTotal(miIdx);
        verificarMisionRenovador(miIdx);

            // 2. Misión de Efectivo
        // Al recibir una propiedad, el dinero de miIdx cambió (o el del vendedor), 
        // por lo que verificamos si alcanzó el límite.
        db.ref('salas/' + sala + '/jugadores/' + miIdx + '/dinero').once('value', s => {
            verificarMisionCajaFuerte(miIdx, s.val());
        });

        // 3. Misión de Interacción (Negociador)
        // Usamos o.de, que es donde guardaste el ID del vendedor al crear la oferta
        let vendedorIdx = o.de; 
        verificarMisionNegociador(vendedorIdx);
        
            
            db.ref('salas/' + sala + '/propiedades/' + o.prop).update({owner: miIdx, hipotecada: false});
            log(nombres[miIdx] + " compró " + mapa[o.prop].n + " a " + nombres[o.de]);
            db.ref('salas/' + sala + '/ofertas/' + oKey).remove();
            document.getElementById('modal').style.display = 'none';
        });
    }

            let niveles = ["Ninguna", "1 Casa", "2 Casas", "3 Casas", "4 Casas", "Hotel"];

            } else if (prop.owner === miIdx) {
                htmlCard += `<p>Dueño: <b>Tú</b></p><p>Nivel: <b>${niveles[prop.nivel || 0]}</b></p>
                             <p>Estado: <b>${prop.hipotecada ? "Hipotecada" : "Activa"}</b></p>`;
                if (!prop.hipotecada) {

                    extra.innerHTML += `<button class="btn" style="background: #ad0c0c;" onclick="hipotecar(${pos})">Hipotecar (+$${Math.floor(p.p/2)})</button>`;
                } else {
                    extra.innerHTML += `<button class="btn" onclick="liberar(${pos})">Liberar (-$${Math.floor(p.p*0.6)})</button>`;
                }
            } else {
                let alquilerBase = Math.floor(p.p * porcentajes[prop ? prop.nivel || 0 : 0]);
            let alquilerFinal = Math.floor(alquilerBase * multClima);
                
                if(prop.hipotecada) {
                    htmlCard += `<p>Dueño: <b>${nombres[prop.owner]}</b> (Hipotecada)</p>`;
                } else {
                    htmlCard += `<p>Dueño: <b>${nombres[prop.owner]}</b></p>
                     <p>Alquiler actual: <b>$${alquilerFinal}</b></p>
                     <p style="font-size: 10px; margin-top: 5px;"><b>Tabla de precios (Clima: ${data.clima !== undefined ? climas[data.clima].n : '-'}):</b></p>
                     <ul style="font-size: 10px; padding-left: 15px; margin: 0;">${listaAlquileres}</ul>`;
                    
                    if(esCaida && prop.owner !== miIdx) {
            alquilerPendiente = {a: prop.owner, m: alquilerFinal}; // Usamos el final
            extra.innerHTML = `
                <button class="btn" onclick="procesarPago(${miIdx}, ${prop.owner}, ${alquilerFinal})">Pagar Alquiler</button>
                <button class="btn" style="background:#ff80bf" onclick="intentarEvasion(${miIdx}, ${prop.owner}, ${alquilerFinal})">Intentar Evasión</button>
           `;

    function quedarseEnCarcel() { log(nombres[miIdx] + " cumplirá su condena en la cárcel."); document.getElementById('modal').style.display = 'none'; }

    function pasarTurno() {
        turnosSeis = 0;
        db.ref('salas/'+sala+'/jugadores').once('value', snap => {
            let total = snap.numChildren();
            db.ref('salas/'+sala+'/turno').once('value', tSnap => {
                let t = Number(tSnap.val());
                let nuevoTurno = (t + 1) % total;
                db.ref('salas/'+sala+'/jugadores/'+nuevoTurno).once('value', jSnap => {
                    let jugador = jSnap.val();
                    if(jugador.enCarcel > 0) {
                        log(nombres[nuevoTurno] + " está en la cárcel.");
                        db.ref('salas/'+sala+'/jugadores/'+nuevoTurno).update({ enCarcel: jugador.enCarcel - 1 });
                        db.ref('salas/'+sala+'/turno').set((nuevoTurno + 1) % total);
                    } else { db.ref('salas/'+sala+'/turno').set(nuevoTurno); }
                });
            });
        });
    }

    function procesarPago(d, a, m, esEvasionLog = false) {
        db.ref('salas/' + sala + '/jugadores').transaction(j => {
            if(!j) return;
            j[d].dinero = Number(j[d].dinero) - m;
            j[a].dinero = Number(j[a].dinero) + m;
            setTimeout(() => { db.ref('salas/' + sala + '/jugadores/' + d + '/dinero').once('value', s => verificarBancarrota(d, s.val())); }, 500);
            return j;
        });
        if(!esEvasionLog) log(nombres[d] + " pagó $" + m + " a " + nombres[a]);

        document.getElementById('modal').style.display = 'none';
    }

    function mejorar(pos) {

        );

    function tirarDado() { 
    if(miIdx === -1) return;
    
    db.ref('salas/' + sala).once('value', snap => {
        let s = snap.val(); 
        if(s.turno !== miIdx || s.jugadores[miIdx].enCarcel > 0) return;
        
        // 1. Lógica de clima
        if (s.clima === undefined) {
            let climaInicial = Math.floor(Math.random() * climas.length);
            db.ref('salas/' + sala + '/clima').set(climaInicial);
            let mult = climas[climaInicial].mult;
            let mensaje = "¡El clima inicial es " + climas[climaInicial].n + "! " + (mult < 1.0 ? "Descuento del " + Math.round((1 - mult) * 100) + "%." : "Precio normal.");
            log(mensaje);
        }

        // 2. Cálculo del dado y contador
        let dado = Math.floor(Math.random() * 6) + 1;
        document.getElementById('dado-valor').innerText = dado;
        let contadorActual = s.jugadores[miIdx].seisSeguidos || 0;
        let nuevoContador = (dado === 6) ? contadorActual + 1 : 0;

        // 3. Movimiento
        let posActual = Number(s.jugadores[miIdx].pos);
        let nuevaPos = (posActual + dado) % mapa.length;
        
        if (nuevaPos < posActual) { 
            db.ref('salas/'+sala+'/jugadores/'+miIdx+'/dinero').transaction(d => d + 200); 
            log(nombres[miIdx] + " pasó por SALIDA y cobró $200."); 
        }

        // 4. Lógica de Penalización o Movimiento
        if (nuevoContador === 3) {
            log("¡ACUSACIÓN DE FRAUDE! " + nombres[miIdx] + " sacó tres 6 seguidos.");
            db.ref('salas/' + sala + '/jugadores/' + miIdx).update({ 
                pos: 8, 
                enCarcel: 2, 
                seisSeguidos: 0 
            });
            gestionarFraude();
            pasarTurno();
            setTimeout(() => manejarCasilla(8), 600);
        } else {
            db.ref('salas/' + sala + '/jugadores/' + miIdx).update({ 
                pos: nuevaPos, 
                seisSeguidos: nuevoContador 
            });

            if (dado === 6) {
                log("¡Sacaste un 6! Tienes turno extra.");
            } else {
                pasarTurno();
            }
            setTimeout(() => manejarCasilla(nuevaPos), 600);
        }
    }); 
}

    mapa.forEach((m, i) => {

    d.id = 'cell-' + i; 
    d.onclick = () => verPropiedad(i);
    
    // Obtenemos el grupo una sola vez
    let g = obtenerGrupo(i);
    
    // Asignamos el innerHTML UNA SOLA VEZ
    d.innerHTML = `<div class="strip" style="background: ${g ? g.color : 'transparent'}"></div>
