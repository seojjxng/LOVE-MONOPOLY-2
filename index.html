<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monopoly Naeun Town</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        /* (Tu CSS original se mantiene intacto) */
        * { box-sizing: border-box; }
        body { background: #fff0f3; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; color: #c71585; }
        .container { display: flex; gap: 4px; justify-content: center; align-items: flex-start; width: 100%; max-width: 950px; }
        .main-column { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 600px; flex-shrink: 0; }
        .board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); gap: 2px; background: #ffccd5; padding: 4px; border-radius: 10px; width: 600px; height: 600px; position: relative; }
        .celda-juego { background: #ffffff; border: 1px solid #ffccd5; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; width: 100%; height: 100%; font-size: 7px; }
        .celda-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; text-align: center; padding: 2px; }
        .strip { width: 100%; height: 20%; border-bottom: 2px solid #ffccd5; }
        .nombre { font-size: 8px; font-weight: bold; line-height: 1; }
        .precio { font-size: 7px; color: #ff59aa; font-weight: bold; }
        .interrogacion { font-size: 24px; font-weight: bold; color: #ff59aa; }
        .center-zone { grid-column: 3 / 7; grid-row: 3 / 7; background: #fff5f7; border: 3px dashed #ff80bf; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; border-radius: 10px; gap: 5px; }
        .reputacion-label { cursor: pointer; font-size: 11px; font-weight: bold; color: #ff59aa; }
        .dice-container { perspective: 400px; width: 35px; height: 35px; cursor: pointer; margin: 10px auto; }
        .dice { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.5s ease-out; }
        .face { position: absolute; width: 35px; height: 35px; background: white; border: 1px solid #ff80bf; border-radius: 6px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 5px; backface-visibility: hidden; }
        .dot { width: 6px; height: 6px; background: #ff59aa; border-radius: 50%; visibility: hidden; }
        .show { visibility: visible; }
        .front { transform: translateZ(17.5px); }
        .back { transform: rotateY(180deg) translateZ(17.5px); }
        .right { transform: rotateY(90deg) translateZ(17.5px); }
        .left { transform: rotateY(-90deg) translateZ(17.5px); }
        .top { transform: rotateX(90deg) translateZ(17.5px); }
        .bottom { transform: rotateX(-90deg) translateZ(17.5px); }
        @keyframes girarDado { 0% { transform: rotateX(0deg) rotateY(0deg); } 100% { transform: rotateX(720deg) rotateY(720deg); } }
        .rolling { animation: girarDado 0.6s linear forwards !important; }
        .sidebar { width: 300px; display: flex; flex-direction: column; gap: 15px; }
        .panel { background: #ffffff; padding: 15px; border-radius: 15px; border: 2px solid #ffccd5; }
        .input-field { padding: 8px; border: 1px solid #ffccd5; border-radius: 8px; width: 100%; }
        .btn-sidebar { padding: 10px; width: 100%; border: 1px solid #ffccd5; border-radius: 10px; background: #fff0f3; color: #ff59aa; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-column">
        <div class="board" id="board">
            <div class="center-zone" id="center-zone">
                <div class="reputacion-label" onclick="mostrarAvisoReputacion()">Reputación</div>
                <div class="dice-container" id="contenedor-dado">
                    <div id="dice" class="dice">
                        <div class="face front"><div class="dot show" style="grid-area: 2 / 2;"></div></div>
                        <div class="face back"><div class="dot show" style="grid-area: 1 / 1;"></div><div class="dot show" style="grid-area: 3 / 3;"></div></div>
                        <div class="face right"><div class="dot show" style="grid-area: 1 / 1;"></div><div class="dot show" style="grid-area: 3 / 3;"></div></div>
                        <div class="face left"><div class="dot show" style="grid-area: 1 / 1;"></div><div class="dot show" style="grid-area: 3 / 3;"></div></div>
                        <div class="face top"><div class="dot show" style="grid-area: 1 / 1;"></div><div class="dot show" style="grid-area: 3 / 3;"></div></div>
                        <div class="face bottom"><div class="dot show" style="grid-area: 1 / 1;"></div><div class="dot show" style="grid-area: 3 / 3;"></div></div>
                    </div>
                </div>
                <div class="saldo-container">Saldo: $<span id="dinero-mio">1000</span></div>
            </div>
        </div>
    </div>
    <div class="sidebar">
        <div class="panel">
            <strong>Unirse a Sala</strong>
            <input type="text" id="sala-id" class="input-field" placeholder="Nombre de la sala">
            <button class="btn-sidebar" onclick="window.unirse()">Entrar</button>
        </div>
    </div>
</div>

<script>
    import { firebaseConfig } from './config.js';
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
import { getDatabase } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js";

// Inicializar Firebase
const app = initializeApp(firebaseConfig);
window.db = getDatabase(app);
    const mapa = [{n:"SALIDA",p:0},{n:"ITAEWON",p:100},{n:"ARCA COMUNAL",p:0},{n:"BUSAN",p:200},{n:"SEOCHO",p:250},{n:"GANGNAM",p:300},{n:"?",p:0},{n:"CYBER CAFÉ",p:400},{n:"AUTOMÓVIL",p:450},{n:"CÁRCEL",p:0},{n:"CAFETERÍA",p:500},{n:"RESTAURANTE",p:520},{n:"?",p:0},{n:"SPA",p:300},{n:"CINE",p:450},{n:"HOSPITAL",p:200},{n:"TEATRO",p:500},{n:"ESTADIO",p:950},{n:"ARCA COMUNAL",p:0},{n:"SMENT",p:1400},{n:"YG ENT",p:950},{n:"YJP",p:750},{n:"IMPUESTOS",p:0},{n:"HYBE CORP.",p:2000},{n:"MOTO",p:600},{n:"PARADA",p:0},{n:"AVIÓN",p:600},{n:"TREN",p:600}];
    const grupos = [{color: "#ff80bf", indices: [1, 3, 4, 5]},{color: "#a5d8ff", indices: [7, 10, 11, 13]},{color: "#b2f2bb", indices: [14, 15, 16, 17]},{color: "#ffd8a8", indices: [19, 20, 21, 23]},{color: "#f5f5dc", indices: [8, 24, 26, 27]}];

    function getGridColumn(i) { if (i >= 0 && i <= 7) return 8 - i; if (i >= 8 && i <= 14) return 1; if (i >= 15 && i <= 21) return (i - 14) + 1; return 8; }
    function getGridRow(i) { if (i >= 0 && i <= 7) return 8; if (i >= 8 && i <= 14) return 8 - (i - 7); if (i >= 15 && i <= 21) return 1; return (i - 21) + 1; }

    window.generarTablero = function() {
        const board = document.getElementById('board');
        mapa.forEach((casilla, i) => {
            const d = document.createElement('div');
            d.className = 'celda-juego';
            d.style.gridColumn = getGridColumn(i);
            d.style.gridRow = getGridRow(i);
            let grupo = grupos.find(g => g.indices.includes(i));
            d.innerHTML = (casilla.n === "?") ? `<div class="interrogacion">?</div>` : (grupo ? `<div class="strip" style="background:${grupo.color}"></div><div class="celda-content"><div class="nombre">${casilla.n}</div><div class="precio">${casilla.p > 0 ? '$' + casilla.p : ''}</div></div>` : `<div class="celda-content"><div class="nombre">${casilla.n}</div></div>`);
            board.appendChild(d);
        });
    };

    window.lanzarDado3D = function() {
        const dice = document.getElementById('dice');
        const resultado = Math.floor(Math.random() * 6) + 1;
        dice.classList.remove('rolling');
        void dice.offsetWidth;
        dice.classList.add('rolling');
        setTimeout(() => {
            dice.classList.remove('rolling');
            const rot = {1: "rotateX(0deg) rotateY(0deg)", 2: "rotateY(-90deg)", 3: "rotateX(-90deg)", 4: "rotateX(90deg)", 5: "rotateY(90deg)", 6: "rotateY(180deg)"};
            dice.style.transform = rot[resultado];
        }, 600);
    };

    document.addEventListener('DOMContentLoaded', () => {
        window.generarTablero();
        document.getElementById('contenedor-dado').addEventListener('click', window.lanzarDado3D);
    });
</script>
</body>
</html>
