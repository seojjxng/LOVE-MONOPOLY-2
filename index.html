<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monopoly Naeun Town - Full Sync</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { background: #fff0f3; font-family: 'Montserrat', sans-serif; display: flex; justify-content: center; padding: 20px; color: #c71585; }
        .container { display: flex; gap: 25px; width: 1200px; }
        .game-column { display: flex; flex-direction: column; gap: 15px; }
        .board { display: grid; grid-template-columns: repeat(8, 80px); grid-template-rows: repeat(8, 80px); gap: 5px; background: #ffccd5; padding: 10px; border-radius: 25px; position: relative; }
        .cell { background: white; border: 2px solid #ffccd5; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 8px; font-weight: bold; color: #c71585; text-align: center; position: relative; cursor: pointer; }
        .strip { width: 100%; height: 10px; background: #ff80bf; position: absolute; top: 0; border-top-left-radius: 8px; border-top-right-radius: 8px; }
        .center-zone { grid-column: 2 / 8; grid-row: 2 / 8; background: #fff5f7; border: 3px dashed #ff80bf; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; }
        .token { width: 35px; height: 35px; position: absolute; z-index: 10; transition: all 0.5s ease; pointer-events: none; }
        .sidebar { width: 320px; display: flex; flex-direction: column; gap: 20px; }
        .panel { background: #fff0f9; padding: 20px; border-radius: 20px; border: 2px solid #ffccd5; }
        .btn { width: 100%; padding: 10px; background: #ff59aa; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin: 5px 0; font-size: 12px; }
        .input-field { width: 93%; padding: 8px; margin: 5px 0; border: 1px solid #ffccd5; border-radius: 8px; }
        #log, #chat-log { height: 125px; overflow-y: auto; font-size: 11px; padding: 10px; background: white; border-radius: 10px; border: 1px solid #ffccd5; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-column">
            <div class="board" id="board">
                <img src="https://i.imgur.com/FGnMi8Y.png" id="p0" class="token" style="display:none">
                <img src="https://i.imgur.com/fRZJfP8.png" id="p1" class="token" style="display:none">
                <div class="center-zone">
                    <div id="turno-text" style="font-weight:bold;">ESPERANDO...</div>
                    <div id="dado-valor">0</div>
                    <img src="https://i.imgur.com/Nsafzb4.png" style="width:50px; cursor:pointer" onclick="tirarDado()">
                    <div>💖 $<span id="dinero-mio">1000</span></div>
                </div>
            </div>
        </div>
        <div class="sidebar">
            <div class="panel">
                <strong>Unirse a Sala</strong>
                <input type="text" id="sala-id" class="input-field">
                <button class="btn" id="btn-unirse" onclick="unirse()">Entrar</button>
            </div>
            <div class="panel">
                <strong>Historial</strong><div id="log"></div>
                <strong>Chat</strong><div id="chat-log"></div>
                <input type="text" id="chat-msg" class="input-field">
                <button class="btn" onclick="enviarChat()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://monopolovely-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let miIdx = -1, sala = "", yaEntro = false;
        const mapa = [{n:"SALIDA",p:0}, {n:"IGLESIA",p:100}, {n:"?",p:0}, {n:"BOUTIQUE",p:200}, {n:"CAFÉ",p:150}, {n:"PARQUE",p:120}, {n:"CHEONGDAM",p:500}, {n:"GANGNAM",p:520}, {n:"SEOCHO-GU",p:250}, {n:"MAPO",p:300}, {n:"INCHEON",p:350}, {n:"JOYAS",p:400}, {n:"CÁRCEL",p:0}, {n:"IMPUESTOS",p:0}, {n:"ESTUDIO",p:220}, {n:"?",p:0}, {n:"ARCA",p:0}, {n:"BUKCHON",p:500}, {n:"HOTEL",p:600}, {n:"CINE",p:280}, {n:"MUSEO",p:310}, {n:"GALERÍA",p:330}, {n:"BIBLIOTECA",p:180}, {n:"CLUB",p:450}, {n:"RESTAURANTE",p:400}, {n:"TIENDA",p:250}, {n:"A LA CÁRCEL",p:0}, {n:"CENTRO",p:550}, {n:"PLAZA",p:350}];

        mapa.forEach((m, i) => {
            const d = document.createElement('div');
            d.className = 'cell'; d.id = 'cell-' + i;
            let col, row;
            if (i < 8) { col = i + 1; row = 1; }
            else if (i < 15) { col = 8; row = (i - 7) + 1; }
            else if (i < 23) { col = 8 - (i - 14); row = 8; }
            else { col = 1; row = 8 - (i - 22); }
            d.style.gridColumn = col; d.style.gridRow = row;
            d.innerHTML = `<div class="strip"></div>${m.n}<br>${m.p > 0 ? '$'+m.p : ''}`;
            document.getElementById('board').appendChild(d);
        });

        function unirse() {
            sala = document.getElementById('sala-id').value;
            if(!sala || yaEntro) return;
            yaEntro = true;
            db.ref('salas/' + sala + '/jugadores').once('value', snap => {
                miIdx = snap.numChildren();
                db.ref('salas/' + sala + '/jugadores/' + miIdx).set({pos: 0, dinero: 1000});
                if(miIdx == 0) db.ref('salas/' + sala + '/turno').set(0);
                sincronizar();
            });
        }

        function sincronizar() {
            db.ref('salas/' + sala).on('value', snap => {
                let data = snap.val();
                data.jugadores.forEach((j, i) => {
                    let token = document.getElementById('p'+i);
                    token.style.display = 'block';
                    let cell = document.getElementById('cell-' + j.pos).getBoundingClientRect();
                    token.style.left = (cell.left + 20) + 'px';
                    token.style.top = (cell.top + 20) + 'px';
                    if(i == miIdx) document.getElementById('dinero-mio').innerText = j.dinero;
                });
                document.getElementById('turno-text').innerText = "Turno de: " + (data.turno == miIdx ? "TÚ" : "Jugador " + (data.turno+1));
            });
        }

        function tirarDado() {
            let dado = Math.floor(Math.random()*6)+1;
            document.getElementById('dado-valor').innerText = dado;
            db.ref('salas/'+sala+'/jugadores/'+miIdx+'/pos').transaction(p => (p + dado) % mapa.length);
            db.ref('salas/'+sala+'/turno').transaction(t => (t + 1) % 2);
        }

        function enviarChat() {
            let msg = document.getElementById('chat-msg').value;
            db.ref('salas/'+sala+'/chat').push({n: "Jugador " + (miIdx+1), m: msg});
            document.getElementById('chat-msg').value = "";
        }

        db.ref('salas/').on('child_added', s => { if(sala) document.getElementById('chat-log').innerHTML += `<div>${s.val().n}: ${s.val().m}</div>`; });
    </script>
</body>
</html>
