<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monopoly Naeun Town</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { background: #fff0f3; font-family: 'Montserrat', sans-serif; display: flex; justify-content: center; padding: 20px; color: #c71585; }
        .container { display: flex; gap: 25px; width: 1000px; }
        .game-column { display: flex; flex-direction: column; gap: 15px; }
        .board { display: grid; grid-template-columns: repeat(8, 70px); grid-template-rows: repeat(8, 70px); gap: 5px; background: #ffccd5; padding: 10px; border-radius: 25px; position: relative; }
        .cell { background: white; border: 2px solid #ffccd5; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 7px; font-weight: bold; color: #c71585; text-align: center; position: relative; cursor: pointer; }
        .strip { width: 100%; height: 10px; background: #ff80bf; position: absolute; top: 0; border-top-left-radius: 8px; border-top-right-radius: 8px; }
        .house-container { position: absolute; bottom: 2px; display: flex; gap: 1px; }
        .house { width: 8px; height: 8px; background: #ff59aa; }
        .hotel { width: 20px; height: 8px; background: #c71585; }
        .token { width: 25px; height: 25px; position: absolute; z-index: 10; transition: all 0.5s ease; pointer-events: none; }
        .center-zone { grid-column: 3 / 7; grid-row: 3 / 7; background: #fff5f7; border: 3px dashed #ff80bf; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
        .sidebar { width: 320px; display: flex; flex-direction: column; gap: 20px; }
        .panel { background: #fff0f9; padding: 20px; border-radius: 20px; border: 2px solid #ffccd5; }
        .btn { width: 100%; padding: 10px; background: #ff59aa; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin: 5px 0; font-size: 12px; }
        #log, #chat-log { height: 125px; overflow-y: auto; font-size: 11px; color: #c71585; padding: 10px; background: white; border-radius: 10px; border: 1px solid #ffccd5; margin-bottom: 10px; }
        #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; background: #ffe4e9; padding: 20px; border: 3px solid #ff80bf; border-radius: 15px; text-align: center; z-index: 999; }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-column">
            <div class="board" id="board">
                <div class="center-zone">
                    <div id="clima-display" style="font-size: 10px; font-weight: bold;">Clima: -</div>
                    <div id="turno-text" style="font-weight:bold;">ESPERANDO...</div>
                    <img src="https://i.imgur.com/Nsafzb4.png" style="width:60px; cursor:pointer" onclick="tirarDado()">
                    <div>💖 $<span id="dinero-mio">1000</span></div>
                </div>
            </div>
        </div>
        <div class="sidebar">
            <div class="panel">
                <strong>Unirse</strong>
                <input type="text" id="sala-id" class="input-field" placeholder="Nombre sala">
                <button class="btn" id="btn-unirse" onclick="unirse()">Entrar</button>
            </div>
            <div class="panel">
                <strong>Log</strong><div id="log"></div>
            </div>
        </div>
    </div>
    <div id="modal">
        <h3 id="modal-title"></h3>
        <div id="modal-text"></div>
        <div id="modal-extra"></div>
        <button class="btn" onclick="cerrarModal()">Cerrar</button>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://monopolovely-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let miIdx = -1, sala = "";
        const nombres = ["Dog", "Horse", "Hat", "Car"];

        const mapa = [
        {n:"SALIDA",p:0},{n:"ITAEWON",p:100},{n:"ARCA COMUNAL",p:0},{n:"BUSAN",p:200},{n:"SEOCHO",p:250},{n:"GANGNAM",p:300},{n:"?",p:0},{n:"CHEONGDAM",p:400},
        {n:"CÁRCEL",p:0},{n:"CAFETERÍA",p:500},{n:"RESTAURANTE",p:520},{n:"?",p:0},{n:"SPA",p:300},{n:"CINE",p:350},{n:"HOSPITAL",p:400},{n:"TEATRO",p:500},
        {n:"ESTADIO",p:550},{n:"ARCA COMUNAL",p:0},{n:"SMENT",p:600},{n:"YG ENT",p:700},{n:"YJP",p:750},{n:"IMPUESTOS",p:0},{n:"PISCINA PRIVADA",p:800},{n:"YATE",p:900},
        {n:"PLAYA LOCAL",p:950},{n:"PARADA",p:0},{n:"AEREOPUERTO",p:1000},{n:"TREN",p:1200},{n:"METRO",p:1300}
    ];

         // Variables de clima ampliadas
    const climas = [
        {n: "Lluvia Ligera", mult: 1.0}, {n: "Tormenta", mult: 1.0},
        {n: "Ventisca", mult: 1.0}, {n: "Nevada Suave", mult: 1.0},
        {n: "Primavera Soleada", mult: 1.0}, {n: "Primavera Lluviosa", mult: 1.0},
        {n: "Verano Caluroso", mult: 1.0}, {n: "Verano Nublado", mult: 1.0},
        {n: "Otoño Fresco", mult: 1.0}, {n: "Otoño Ventoso", mult: 1.0}
    ];

        function iniciarRelojClima() {
        setInterval(() => {
            let nuevoClima = Math.floor(Math.random() * climas.length);
            db.ref('salas/' + sala + '/clima').set(nuevoClima);
            log("¡El clima ha cambiado a " + climas[nuevoClima].n + "!");
        }, 600000);
    }

        let alquilerPendiente = null;
    let turnosSeis = 0;
    const cartasEvento = [
        {txt: "¡Inversión exitosa! Cobras $200", v: 200},
        {txt: "¡Olvidaste pagar la factura de luz! Pagas $250 por mora", v: -250},
        {txt: "¡Premio de certamen de belleza! Cobras $100", v: 100},
        {txt: "¡Reparaciones en casa! Pagas $150", v: -150},
        {txt: "¡Multa por exceso de velocidad! Pagas $350", v: -350},
        {txt: "¡Encontraste $60 en la calle! Cobras $60", v: 60},
        {txt: "¡Dividendos bancarios! Cobras $50", v: 50},
        {txt: "¡Multa por exceso de velocidad! Pagas $100", v: -100},
        {txt: "¡Venta de activos! Cobras $250", v: 250},
        {txt: "¡Gastos médicos de la abuela! Pagas $200", v: -200},
        {txt: "¡Bono de Naeun Town! Cobras $150", v: 150},
        {txt: "¡Impuesto de lujo! Pagas $100", v: -100},
        {txt: "¡Heredaste una cuantiosa suma de la tía de una tía! Recibes $150", v: 150}
    ];

    function obtenerCarta() { return cartasEvento[Math.floor(Math.random() * cartasEvento.length)]; }
    function cerrarModal() { document.getElementById('modal').style.display = 'none'; document.getElementById('modal-extra').innerHTML = ""; }
    function log(txt) { db.ref('salas/' + sala + '/log').push(txt);

        function ejecutarEvento(nombreCasilla) {
        let carta = obtenerCarta();
        db.ref('salas/'+sala+'/jugadores/'+miIdx+'/dinero').transaction(d => {
            let nuevo = Number(d) + carta.v;
            setTimeout(() => verificarBancarrota(miIdx, nuevo), 500);
            return nuevo;
        });
        log(nombres[miIdx] + " cayó en " + nombreCasilla + ": " + carta.txt);
        document.getElementById('modal-title').innerText = nombreCasilla;
        document.getElementById('modal-text').innerText = carta.txt;
        document.getElementById('modal-extra').innerHTML = ""; 
        document.getElementById('modal').style.display = 'block';
    }


        function abrirIntercambio() {
        db.ref('salas/' + sala).once('value', snap => {
            let data = snap.val();
            let misProps = [];
            if(data.propiedades) {
                Object.keys(data.propiedades).forEach(pIdx => {
                    if(data.propiedades[pIdx].owner === miIdx) misProps.push(pIdx);
                });
            }
            document.getElementById('modal-title').innerText = "Revender Propiedad";
            let html = "Selecciona propiedad y comprador:<br>";
            if(misProps.length === 0) { html += "No tienes propiedades."; }
            else {
                misProps.forEach(pIdx => {
                    let p = mapa[pIdx];
                    html += `<br><b>${p.n}</b> ($${p.p}): <select id="sel-${pIdx}">`;
                    data.jugadores.forEach((j, i) => { if(i !== miIdx) html += `<option value="${i}">${nombres[i]}</option>`; });
                    html += `</select> <button class="btn" onclick="proponerVenta(${pIdx})">Vender</button>`;
                });
            }
            document.getElementById('modal-text').innerHTML = html;
            document.getElementById('modal').style.display = 'block';
        });
    }

function unirse() { 
        if(yaEntro) return;
        sala = document.getElementById('sala-id').value; 
        if(!sala) return;
        yaEntro = true;
        document.getElementById('btn-unirse').disabled = true;
        db.ref('salas/' + sala + '/jugadores').once('value', snap => { 
            miIdx = snap.numChildren(); 
            db.ref('salas/' + sala + '/jugadores/' + miIdx).set({ pos: 0, dinero: 1000, enCarcel: 0, tienePrestamo: false, montoPrestamo: 0 }); 
            if(miIdx == 0) { db.ref('salas/' + sala + '/turno').set(0); iniciarRelojClima(); }
            db.ref('salas/' + sala + '/chat').push({ n: "Sistema", m: nombres[miIdx] + " ha entrado a la sala." });
            sincronizar(); 
        }); 
    }
        
        function verificarBancarrota(jugadorIdx, saldo) {
        if (saldo < 0) {
            log("¡" + nombres[jugadorIdx] + " ha caído en números rojos!");
            document.getElementById('modal-title').innerText = "¡Bancarrota!";
            document.getElementById('modal-text').innerText = "Tu saldo es $" + saldo + ". ¡Te recomiendo un préstamo!";
            document.getElementById('modal-extra').innerHTML = `<button class="btn" onclick="abrirBanco()">Ir al Banco</button>`;
            document.getElementById('modal').style.display = 'block';
        }
    }
        
        function proponerVenta(pIdx) {
        let comprador = document.getElementById('sel-'+pIdx).value;
        let precio = Math.floor(mapa[pIdx].p * 0.8);
        db.ref('salas/' + sala + '/ofertas').push({prop: pIdx, de: miIdx, para: comprador, precio: precio});
        log(nombres[miIdx] + " propuso vender " + mapa[pIdx].n + " a " + nombres[comprador] + " por $" + precio);
        document.getElementById('modal').style.display = 'none';
    }

        function escucharOfertas() {
        db.ref('salas/' + sala + '/ofertas').on('child_added', snap => {
            let o = snap.val();
            if(o.para == miIdx) {
                document.getElementById('modal-title').innerText = "¡Oferta de compra!";
                document.getElementById('modal-text').innerText = nombres[o.de] + " quiere venderte " + mapa[o.prop].n + " por $" + o.precio;
                document.getElementById('modal-extra').innerHTML = `<button class="btn" onclick="confirmarCompra('${snap.key}')">Aceptar</button>`;
                document.getElementById('modal').style.display = 'block';
            }
        });
    }
        
        function confirmarCompra(oKey) {
        db.ref('salas/' + sala + '/ofertas/' + oKey).once('value', snap => {
            let o = snap.val();
            db.ref('salas/' + sala + '/jugadores').transaction(j => {
                if(j[miIdx].dinero >= o.precio) {
                    j[miIdx].dinero -= o.precio;
                    j[o.de].dinero += o.precio;
                    return j;
                }
                return;
            });
            db.ref('salas/' + sala + '/propiedades/' + o.prop).update({owner: miIdx, hipotecada: false});
            log(nombres[miIdx] + " compró " + mapa[o.prop].n + " a " + nombres[o.de]);
            db.ref('salas/' + sala + '/ofertas/' + oKey).remove();
            document.getElementById('modal').style.display = 'none';
        });
    }

        function gestionarHipoteca(propiedadId) {
    db.ref('salas/' + sala + '/propiedades/' + propiedadId).once('value', snap => {
        let prop = snap.val();
        let valorMejoras = (prop.casas * 50) + (prop.hoteles * 200); // Valor de mejoras
        let valorHipoteca = prop.valorBase + valorMejoras;

        if (!prop.hipotecada) {
            // Acción de Hipotecar
            db.ref('salas/' + sala + '/propiedades/' + propiedadId).update({ hipotecada: true });
            db.ref('salas/' + sala + '/jugadores/' + miIdx + '/dinero').transaction(d => d + valorHipoteca);
            log("Propiedad hipotecada por $" + valorHipoteca);
        } else {
            // Acción de Redimir (pagar hipoteca + 10% de interés)
            let costoRedencion = valorHipoteca * 1.1;
            db.ref('salas/' + sala + '/jugadores/' + miIdx + '/dinero').once('value', s => {
                if (s.val() >= costoRedencion) {
                    db.ref('salas/' + sala + '/propiedades/' + propiedadId).update({ hipotecada: false });
                    db.ref('salas/' + sala + '/jugadores/' + miIdx + '/dinero').transaction(d => d - costoRedencion);
                    log("Propiedad redimida.");
                } else {
                    alert("No tienes suficiente dinero para redimir.");
                }
            });
        }
    });
}

        // Modificación necesaria en la función de pago de alquiler
function procesarPago(propietarioIdx, monto) {
    // Verificar si la propiedad está hipotecada antes de procesar el pago
    db.ref('salas/' + sala + '/propiedades/' + currentCasilla).once('value', snap => {
        if (snap.val().hipotecada) {
            log("La propiedad está hipotecada, no se paga alquiler.");
            return;
        }
        function procesarPago(d, a, m, esEvasionLog = false) {
        db.ref('salas/' + sala + '/jugadores').transaction(j => {
            if(!j) return;
            j[d].dinero = Number(j[d].dinero) - m;
            j[a].dinero = Number(j[a].dinero) + m;
            setTimeout(() => { db.ref('salas/' + sala + '/jugadores/' + d + '/dinero').once('value', s => verificarBancarrota(d, s.val())); }, 500);
            return j;
        });
        if(!esEvasionLog) log(nombres[d] + " pagó $" + m + " a " + nombres[a]);
        alquilerPendiente = null;
        document.getElementById('modal').style.display = 'none';
    }

    function comprar(pos) { log(nombres[miIdx] + " compró " + mapa[pos].n); db.ref('salas/' + sala + '/propiedades/' + pos).set({owner: miIdx, nivel: 0, hipotecada: false}); db.ref('salas/' + sala + '/jugadores/' + miIdx + '/dinero').transaction(d => Number(d) - Number(mapa[pos].p)); document.getElementById('modal').style.display = 'none'; }
    function mejorar(pos) { log(nombres[miIdx] + " mejoró " + mapa[pos].n); db.ref('salas/' + sala + '/propiedades/' + pos + '/nivel').transaction(n => (Number(n) || 0) + 1); db.ref('salas/' + sala + '/jugadores/' + miIdx + '/dinero').transaction(d => Number(d) - 50); document.getElementById('modal').style.display = 'none'; }
    });
}

        // Lógica de clima inicial al primer movimiento
            if (s.clima === undefined) {
                let climaInicial = Math.floor(Math.random() * 9); // Indices para Primavera, Verano, Otoño
                db.ref('salas/' + sala + '/clima').set(climaInicial);
                log("¡El clima inicial es " + climas[climaInicial].n + "!");
            }

            let dado = Math.floor(Math.random()*6)+1;
            document.getElementById('dado-valor').innerText = dado;
            let posActual = Number(s.jugadores[miIdx].pos);
            let nuevaPos = (posActual + dado) % mapa.length;
            if (nuevaPos < posActual) { db.ref('salas/'+sala+'/jugadores/'+miIdx+'/dinero').transaction(d => d + 100); log(nombres[miIdx] + " pasó por SALIDA y cobró $100."); }
            db.ref('salas/' + sala + '/jugadores/' + miIdx + '/pos').set(nuevaPos);
            pasarTurno();
            setTimeout(() => manejarCasilla(nuevaPos), 600);
        }); 
    }

    function abrirBanco() { const montos = [200, 300, 450, 670, 800, 1000]; document.getElementById('modal-title').innerText = "Solicitar Préstamo"; let htmlExtra = ""; montos.forEach(m => { htmlExtra += `<button class="btn" onclick="pedirPrestamo(${m})">Pedir $${m}</button>`; }); document.getElementById('modal-extra').innerHTML = htmlExtra; document.getElementById('modal').style.display = 'block'; }
    function pedirPrestamo(m) { db.ref('salas/' + sala + '/jugadores/' + miIdx).once('value', snap => { let jugador = snap.val(); if (jugador.tienePrestamo) { alert("Ya tienes un préstamo activo. ¡Págalo primero!"); return; } db.ref('salas/' + sala + '/jugadores/' + miIdx).update({ dinero: firebase.database.ServerValue.increment(m), tienePrestamo: true, montoPrestamo: m }); log(nombres[miIdx] + " pidió un préstamo de $" + m); cerrarModal(); }); }
    function pagarPrestamo() { db.ref('salas/' + sala + '/jugadores/' + miIdx).once('value', snap => { let j = snap.val(); if (j.tienePrestamo) { if (j.dinero >= j.montoPrestamo) { db.ref('salas/' + sala + '/jugadores/' + miIdx).update({ dinero: firebase.database.ServerValue.increment(-j.montoPrestamo), tienePrestamo: false, montoPrestamo: 0 }); log(nombres[miIdx] + " liquidó su préstamo."); } else { document.getElementById('modal-title').innerText = "Fondos insuficientes"; document.getElementById('modal-text').innerHTML = `<div class="empty-debt">No tienes suficiente dinero para pagar el préstamo.</div>`; document.getElementById('modal-extra').innerHTML = ""; document.getElementById('modal').style.display = 'block'; } } else { document.getElementById('modal-title').innerText = "Banco"; document.getElementById('modal-text').innerHTML = `<div class="empty-debt">No tienes préstamos pendientes.</div>`; document.getElementById('modal-extra').innerHTML = ""; document.getElementById('modal').style.display = 'block'; } }); }
    function verSaldos() { db.ref('salas/' + sala + '/jugadores').once('value', snap => { let txt = ""; snap.forEach(c => { txt += nombres[parseInt(c.key)] + ": $" + c.val().dinero + "<br>"; }); document.getElementById('modal-title').innerText = "Saldos"; document.getElementById('modal-text').innerHTML = txt; document.getElementById('modal').style.display = 'block'; }); }
    function enviarChat() { let msg = document.getElementById('chat-msg').value; db.ref('salas/' + sala + '/chat').push({ n: nombres[miIdx], m: msg }); document.getElementById('chat-msg').value = ""; }
    
    function sincronizar() { 
        escucharOfertas();
        db.ref('salas/' + sala).on('value', snap => { 
            let s = snap.val(); if(!s) return; 
            document.getElementById('dinero-mio').innerText = s.jugadores[miIdx].dinero;
            document.getElementById('turno-text').innerText = "Turno: " + nombres[s.turno];
            if(s.clima !== undefined) { let c = climas[s.clima]; document.getElementById('clima-display').innerText = "Estación: " + c.n; }
            s.jugadores.forEach((j, i) => { 
                let el = document.getElementById('p' + i); el.style.display = 'block'; 
                let cell = document.getElementById('cell-' + j.pos); 
                el.style.left = (cell.offsetLeft + 30) + 'px'; el.style.top = (cell.offsetTop + 30) + 'px'; 
            });
            if(s.propiedades) { Object.keys(s.propiedades).forEach(pos => { 
                let cell = document.getElementById('cell-' + pos);
                if(cell) {
                    cell.style.backgroundColor = s.propiedades[pos].hipotecada ? "#ccc" : colores[s.propiedades[pos].owner];
                    let hc = cell.querySelector('.house-container'); hc.innerHTML = "";
                    let nivel = s.propiedades[pos].nivel || 0;
                    if(nivel > 0 && nivel < 5) { for(let i=0; i<nivel; i++) { let h = document.createElement('div'); h.className = 'house'; hc.appendChild(h); } }
                    else if(nivel === 5) { let h = document.createElement('div'); h.className = 'hotel'; hc.appendChild(h); }
                }
            }); }
            if(s.chat) { let h = ""; Object.values(s.chat).forEach(c => h += "<b>"+c.n+":</b> "+c.m+"<br>"); document.getElementById('chat-log').innerHTML = h; }
            if(s.log) { let h = ""; Object.values(s.log).forEach(l => h += l + "<br>"); document.getElementById('log').innerHTML = h; }
        }); 
    }

        function tirarDado() {
            db.ref('salas/' + sala).once('value', snap => {
                let s = snap.val();
                if(s.turno !== miIdx) return;
                
                if(s.jugadores[miIdx].enCarcel > 0) {
                    mostrarModal("Cárcel", "Estás cumpliendo condena. ¿Pagar $100?", '<button class="btn" onclick="pagarFianza()">Pagar Fianza</button>');
                    return;
                }
                let dado = Math.floor(Math.random()*6)+1;
                let nuevaPos = (s.jugadores[miIdx].pos + dado) % 28;
                db.ref('salas/'+sala+'/jugadores/'+miIdx).update({pos: nuevaPos});
                if(nuevaPos === 8) db.ref('salas/'+sala+'/jugadores/'+miIdx).update({enCarcel: 2});
                pasarTurno();
            });
        }

        function pasarTurno() {
            db.ref('salas/'+sala).once('value', snap => {
                let s = snap.val();
                let next = (s.turno + 1) % s.jugadores.length;
                if(s.jugadores[next].enCarcel > 0) {
                    db.ref('salas/'+sala+'/jugadores/'+next+'/enCarcel').set(s.jugadores[next].enCarcel - 1);
                    log("Turno a " + nombres[next] + " (en cárcel).");
                }
                db.ref('salas/'+sala+'/turno').set(next);
            });
        }

        function manejarCasilla(pos) {
        let p = mapa[pos];
        if (p.n === "A LA CÁRCEL" || p.n === "CÁRCEL") {
            db.ref('salas/'+sala+'/jugadores/'+miIdx).update({pos: 8, enCarcel: 2});
            log(nombres[miIdx] + " fue enviado a la cárcel.");
            document.getElementById('modal-title').innerText = "Cárcel";
            document.getElementById('modal-text').innerText = "¡Estás en la cárcel!";
            document.getElementById('modal-extra').innerHTML = `<button class="btn" onclick="pagarFianza()">Pagar Fianza ($100)</button><button class="btn" onclick="quedarseEnCarcel()">Quedarse</button>`;
            document.getElementById('modal').style.display = 'block';
            turnosSeis = 0;
            pasarTurno();
            return;
        }
        if (p.n === "?" || p.n === "ARCA") { ejecutarEvento(p.n); return; }
        if (p.n === "IMPUESTOS") {
            db.ref('salas/' + sala + '/jugadores/' + miIdx + '/dinero').transaction(d => {
                let nuevo = Number(d) - 100;
                setTimeout(() => verificarBancarrota(miIdx, nuevo), 500);
                return nuevo;
            });
            log(nombres[miIdx] + " pagó impuestos de $100.");
            document.getElementById('modal-title').innerText = "Impuestos";
            document.getElementById('modal-text').innerText = "Pagaste $100.";
            document.getElementById('modal-extra').innerHTML = "";
            document.getElementById('modal').style.display = 'block';
            return;
        }
        verPropiedad(pos, true);
    }

        function pagarFianza() {
            db.ref('salas/'+sala+'/jugadores/'+miIdx).once('value', snap => {
                let j = snap.val();
                if(j.dinero >= 100) {
                    db.ref('salas/'+sala+'/jugadores/'+miIdx).update({enCarcel: 0, dinero: j.dinero - 100});
                    cerrarModal();
                } else alert("Dinero insuficiente.");
            });
        }

        function pasarTurno() {
        turnosSeis = 0;
        db.ref('salas/'+sala+'/jugadores').once('value', snap => {
            let total = snap.numChildren();
            db.ref('salas/'+sala+'/turno').once('value', tSnap => {
                let t = Number(tSnap.val());
                let nuevoTurno = (t + 1) % total;
                db.ref('salas/'+sala+'/jugadores/'+nuevoTurno).once('value', jSnap => {
                    let jugador = jSnap.val();
                    if(jugador.enCarcel > 0) {
                        log(nombres[nuevoTurno] + " está en la cárcel.");
                        db.ref('salas/'+sala+'/jugadores/'+nuevoTurno).update({ enCarcel: jugador.enCarcel - 1 });
                        db.ref('salas/'+sala+'/turno').set((nuevoTurno + 1) % total);
                    } else { db.ref('salas/'+sala+'/turno').set(nuevoTurno); }
                });
            });
        });
    }

        

        function mostrarModal(t, txt, extra) {
            document.getElementById('modal-title').innerText = t;
            document.getElementById('modal-text').innerText = txt;
            document.getElementById('modal-extra').innerHTML = extra;
            document.getElementById('modal').style.display = 'block';
        }
        function cerrarModal() { document.getElementById('modal').style.display = 'none'; }
        function log(t) { db.ref('salas/'+sala+'/log').push(t); }
        function unirse() { sala = document.getElementById('sala-id').value; db.ref('salas/'+sala+'/jugadores').once('value', s => { miIdx = s.numChildren(); db.ref('salas/'+sala+'/jugadores/'+miIdx).set({pos:0, dinero:1000, enCarcel:0}); }); }
    </script>
</body>
