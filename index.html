<!DOCTYPE html>
<html lang="es"><head>
    <meta charset="UTF-8">
    <title>Monopoly Naeun Town</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { background: #fff0f3; font-family: 'Montserrat', sans-serif; display: flex; justify-content: center; padding: 20px; color: #c71585; }
        .container { display: flex; gap: 25px; width: 1000px; }
        .game-column {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 600px; /* Tamaño fijo para el tablero */
    flex-shrink: 0; /* IMPEDIR QUE SE ENCOJA */
}
        
        /* Tablero reducido */
        .board { display: grid; grid-template-columns: repeat(8, 70px); grid-template-rows: repeat(8, 70px); gap: 5px; background: #ffccd5; padding: 10px; border-radius: 25px; position: relative; justify-content: center; align-content: center; }
        .cell { background: white; border: 2px solid #ffccd5; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 7px; font-weight: bold; color: #c71585; text-align: center; position: relative; cursor: pointer; }
        
        .strip { width: 100%; height: 10px; position: absolute; top: 0; border-top-left-radius: 8px; border-top-right-radius: 8px; }
        .house-container { position: absolute; bottom: 2px; display: flex; gap: 1px; }
        .house { width: 8px; height: 8px; background: #ff59aa; }
        .hotel { width: 20px; height: 8px; background: #c71585; }
        .token { width: 25px; height: 25px; position: absolute; z-index: 10; transition: all 0.5s ease; pointer-events: none; }
        #modal-misiones { 
    display: none; 
    position: fixed; 
    top: 50%; 
    left: 50%; 
    transform: translate(-50%, -50%); 
    width: 350px; 
    background: #ffe4e9; 
    padding: 20px; 
    border: 3px solid #ff80bf; 
    border-radius: 15px; 
    text-align: center; 
    z-index: 1000; 
}
#lista-misiones { 
    list-style: none; 
    padding: 0; 
    text-align: left; 
    max-height: 300px; 
    overflow-y: auto; 
    font-size: 12px;
}
#lista-misiones li { 
    margin-bottom: 8px; 
    border-bottom: 1px solid #ffccd5; 
    padding-bottom: 5px; 
}
        /* Zona central ajustada */
        .center-zone { grid-column: 3 / 7; grid-row: 3 / 7; background: #fff5f7; border: 3px dashed #ff80bf; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
        
        .sidebar { width: 320px; display: flex; flex-direction: column; gap: 20px; }
        .panel { background: #fff0f9; padding: 20px; border-radius: 20px; border: 2px solid #ffccd5; }
        .btn { width: 100%; padding: 10px; background: #ff59aa; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin: 5px 0; font-size: 12px; }
        .input-field { width: 93%; padding: 8px; margin: 5px 0; border: 1px solid #ffccd5; border-radius: 8px; }
        #log { height: 125px; overflow-y: auto; font-size: 11px; color: #c71585; padding: 10px; background: white; border-radius: 10px; border: 1px solid #ffccd5; margin-bottom: 10px; }
        #chat-log { height: 125px; overflow-y: auto; font-size: 11px; color: #c71585; padding: 10px; background: white; border-radius: 10px; border: 1px solid #ffccd5; margin-bottom: 10px; }
        #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; background: #ffe4e9; padding: 20px; border: 3px solid #ff80bf; border-radius: 15px; text-align: center; z-index: 999; }
        .card-property { border: 2px solid #c71585; padding: 10px; border-radius: 5px; background: white; margin-bottom: 10px; }
        .card-header { background: #ff80bf; color: white; padding: 5px; font-weight: bold; margin-bottom: 10px; }
        .empty-debt { padding: 10px; background: #fff; border: 1px solid #ff80bf; border-radius: 10px; color: #ff59aa; font-weight: bold; }
        #banco-container {
    display: flex !important;
    flex-wrap: wrap !important;
    justify-content: center !important;
    gap: 10px !important;
    width: 100% !important; /* Ocupa solo el ancho de su columna */
    box-sizing: border-box !important;
    background: #fff0f9;
    padding: 15px;
    border: 2px solid #ffccd5;
    border-radius: 20px;
}

#banco-container .btn {
    width: auto !important; 
    min-width: 120px;      
    margin: 0 !important;  
}
        /* Posicionamiento de las 29 casillas */
        #cell-0 { grid-column: 1; grid-row: 1; } #cell-1 { grid-column: 2; grid-row: 1; } #cell-2 { grid-column: 3; grid-row: 1; } #cell-3 { grid-column: 4; grid-row: 1; } #cell-4 { grid-column: 5; grid-row: 1; } #cell-5 { grid-column: 6; grid-row: 1; } #cell-6 { grid-column: 7; grid-row: 1; } #cell-7 { grid-column: 8; grid-row: 1; }
        #cell-8 { grid-column: 8; grid-row: 2; } #cell-9 { grid-column: 8; grid-row: 3; } #cell-10 { grid-column: 8; grid-row: 4; } #cell-11 { grid-column: 8; grid-row: 5; } #cell-12 { grid-column: 8; grid-row: 6; } #cell-13 { grid-column: 8; grid-row: 7; } #cell-14 { grid-column: 8; grid-row: 8; }
        #cell-15 { grid-column: 7; grid-row: 8; } #cell-16 { grid-column: 6; grid-row: 8; } #cell-17 { grid-column: 5; grid-row: 8; } #cell-18 { grid-column: 4; grid-row: 8; } #cell-19 { grid-column: 3; grid-row: 8; } #cell-20 { grid-column: 2; grid-row: 8; } #cell-21 { grid-column: 1; grid-row: 8; }
        #cell-22 { grid-column: 1; grid-row: 7; } #cell-23 { grid-column: 1; grid-row: 6; } #cell-24 { grid-column: 1; grid-row: 5; } #cell-25 { grid-column: 1; grid-row: 4; } #cell-26 { grid-column: 1; grid-row: 3; } #cell-27 { grid-column: 1; grid-row: 2; }
    </style></head><body><audio loop autoplay>
    <source src="https://dl.dropbox.com/scl/fi/5oxzgnxoe30zqd4m6hdfh/kawaii-playlist-for-snack-time-BGM-POP.mp3?rlkey=1lw76u3u1w1ck3dj2ej5x7ml7&st=y6j07iwx&dl=1" type="audio/mpeg"></audio><div class="container">
    <div class="game-column">
        <div class="board" id="board">
            <img src="https://i.imgur.com/FGnMi8Y.png" id="p0" class="token" style="display:none">
            <img src="https://i.imgur.com/fRZJfP8.png" id="p1" class="token" style="display:none">
            <img src="https://i.imgur.com/u2AtssG.png" id="p2" class="token" style="display:none">
            <img src="https://i.imgur.com/ekQp8WL.png" id="p3" class="token" style="display:none">
            
            <div class="center-zone">
                <div id="clima-display" style="font-size: 15px; color: #ff59aa; font-weight: bold;">Clima: -</div>
                <div id="turno-text" style="font-weight:bold;">ESPERANDO...</div>
                <div id="dado-valor">0</div>
                <img src="https://i.imgur.com/Nsafzb4.png" style="width:60px; cursor:pointer" onclick="tirarDado()">
                <div>💖 $<span id="dinero-mio">1000</span></div>
                <div style="font-size: 15px; margin-top: 5px;">Monto de impuestos actuales: $<span id="monto-impuestos">0</span></div>
                
                <button class="btn" onclick="abrirModalMisiones()">Ver Misiones</button>
            </div>
        </div>

        <div id="banco-container">
            <button class="btn" style="width: 140px" onclick="abrirBanco()">🏦 Banco</button>
            <button class="btn" style="width: 140px" onclick="pagarPrestamo()">💳 Pagar Préstamo</button>
            <button class="btn" style="width: 140px" onclick="verSaldos()">💰 Ver Saldos</button>
            <button class="btn" style="width: 140px; background: #ff59aa;" onclick="abrirIntercambio()">🤝 Intercambiar</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="panel">
            <strong>Unirse a Sala</strong>
            <input type="text" id="sala-id" class="input-field" placeholder="Nombre de la sala">
            <button class="btn" id="btn-unirse" onclick="unirse()">Entrar a la sala</button>
        </div>
        <div class="panel">
            <strong>Historial</strong><div id="log"></div>
            <strong>Chat</strong><div id="chat-log"></div>
            <input type="text" id="chat-msg" class="input-field" placeholder="Mensaje...">
            <button class="btn" onclick="enviarChat()">Enviar</button>
        </div>
    </div>
</div>

<div id="modal-misiones" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 350px; background: #ffe4e9; padding: 20px; border: 3px solid #ff80bf; border-radius: 15px; text-align: center; z-index: 1000;"> 
    <h3>Misiones Disponibles</h3>
    <ul id="lista-misiones" style="list-style: none; padding: 0; text-align: left; max-height: 300px; overflow-y: auto; font-size: 12px;"></ul>
    <button class="btn" onclick="document.getElementById('modal-misiones').style.display = 'none'">Cerrar</button>
</div>
        
    </div></div><div id="modal">
    <h3 id="modal-title"></h3>
    <div id="modal-text"></div>
    <div id="modal-extra"></div>
    <button class="btn" id="btn-cerrar" onclick="cerrarModal()">Cerrar</button></div><script>
    const firebaseConfig = { databaseURL: "https://monopolovely-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let miIdx = -1, sala = "", yaEntro = false;
    const nombres = ["Dog", "Horse", "Hat", "Car"];
    const colores = ["#ffb7b2", "#ffd8a8", "#b2f2bb", "#a5d8ff"];

        // Configuración de colores por grupo
    const grupos = [
        {color: "#ff80bf", indices: [1, 3, 4, 5]},
        {color: "#a5d8ff", indices: [7, 9, 10, 12]},
        {color: "#b2f2bb", indices: [13, 14, 15, 16]},
        {color: "#ffd8a8", indices: [18, 19, 20, 22]},
        {color: "#eebafa", indices: [23, 24, 26, 27]}
    ];

        function obtenerGrupo(pos) {
    return grupos.find(g => g.indices.includes(pos));
}
        
    const mapa = [
        {n:"SALIDA",p:0},{n:"ITAEWON",p:100},{n:"ARCA COMUNAL",p:0},{n:"BUSAN",p:200},{n:"SEOCHO",p:250},{n:"GANGNAM",p:300},{n:"?",p:0},{n:"CHEONGDAM",p:400},
        {n:"CÁRCEL",p:0},{n:"CAFETERÍA",p:500},{n:"RESTAURANTE",p:520},{n:"?",p:0},{n:"SPA",p:300},{n:"CINE",p:350},{n:"HOSPITAL",p:400},{n:"TEATRO",p:500},
        {n:"ESTADIO",p:550},{n:"ARCA COMUNAL",p:0},{n:"SMENT",p:600},{n:"YG ENT",p:700},{n:"YJP",p:750},{n:"IMPUESTOS",p:0},{n:"PISCINA PRIVADA",p:800},{n:"YATE",p:900},
        {n:"PLAYA LOCAL",p:950},{n:"PARADA",p:0},{n:"AEREOPUERTO",p:1000},{n:"TREN",p:1200},{n:"METRO",p:1300}
    ];

    // Variables de clima ampliadas
    const climas = [
        {n: "Lluvia Ligera", mult: 1.0}, {n: "Tormenta", mult: 1.0},
        {n: "Ventisca", mult: 1.0}, {n: "Nevada Suave", mult: 1.0},
        {n: "Primavera Soleada", mult: 1.0}, {n: "Primavera Lluviosa", mult: 1.0},
        {n: "Verano Caluroso", mult: 1.0}, {n: "Verano Nublado", mult: 1.0},
        {n: "Otoño Fresco", mult: 1.0}, {n: "Otoño Ventoso", mult: 1.0}
    ];

    function iniciarRelojClima() {
        setInterval(() => {
            let nuevoClima = Math.floor(Math.random() * climas.length);
            db.ref('salas/' + sala + '/clima').set(nuevoClima);
            log("¡El clima ha cambiado a " + climas[nuevoClima].n + "!");
        }, 600000);
    }

    let alquilerPendiente = null;
    let turnosSeis = 0;
    const cartasEvento = [
        {txt: "¡Inversión exitosa! Cobras $200", v: 200},
        {txt: "¡Olvidaste pagar la factura de luz! Pagas $250 por mora", v: -250},
        {txt: "¡Premio de certamen de belleza! Cobras $100", v: 100},
        {txt: "¡Reparaciones en casa! Pagas $150", v: -150},
        {txt: "¡Multa por exceso de velocidad! Pagas $350", v: -350},
        {txt: "¡Encontraste $60 en la calle! Cobras $60", v: 60},
        {txt: "¡Dividendos bancarios! Cobras $50", v: 50},
        {txt: "¡Multa por exceso de velocidad! Pagas $100", v: -100},
        {txt: "¡Venta de activos! Cobras $250", v: 250},
        {txt: "¡Gastos médicos de la abuela! Pagas $200", v: -200},
        {txt: "¡Bono de Naeun Town! Cobras $150", v: 150},
        {txt: "¡Impuesto de lujo! Pagas $100", v: -100},
        {txt: "¡Heredaste una cuantiosa suma de la tía de una tía! Recibes $150", v: 150}
    ];

    function obtenerCarta() { return cartasEvento[Math.floor(Math.random() * cartasEvento.length)]; }
    function cerrarModal() { document.getElementById('modal').style.display = 'none'; document.getElementById('modal-extra').innerHTML = ""; }
    function log(txt) { db.ref('salas/' + sala + '/log').push(txt); }
    
    function unirse() { 
        if(yaEntro) return;
        sala = document.getElementById('sala-id').value; 
        if(!sala) return;
        yaEntro = true;
        document.getElementById('btn-unirse').disabled = true;
        db.ref('salas/' + sala + '/jugadores').once('value', snap => { 
            miIdx = snap.numChildren(); 
            db.ref('salas/' + sala + '/jugadores/' + miIdx).set({ pos: 0, dinero: 1000, enCarcel: 0, tienePrestamo: false, montoPrestamo: 0 }); 
            if(miIdx == 0) { db.ref('salas/' + sala + '/turno').set(0); iniciarRelojClima(); }
            db.ref('salas/' + sala + '/chat').push({ n: "Sistema", m: nombres[miIdx] + " ha entrado a la sala." });
            sincronizar(); 
        }); 
    }

        function abrirModalMisiones() {
    db.ref('salas/' + sala + '/jugadores/' + miIdx + '/misionesCumplidas').once('value', snap => {
        let completadas = snap.val() || {};
        let lista = document.getElementById('lista-misiones');
        lista.innerHTML = ""; // Limpiar lista anterior

        const misiones = [
            { id: 'inversorInicial', titulo: 'Inversor Inicial. Poseer al menos 3 propiedades de cualquier tipo.', rec: 200 },
            { id: 'coleccionista', titulo: 'El coleccionista. Ser el primero en completar cualquier set de color.', rec: 300 },
            { id: 'negociador', titulo: 'El negociador. Por realizar tu primer intercambio exitoso con otro jugador.', rec: 400 },
            { id: 'cajafuerte', titulo: 'Caja fuerte. Acumular un total de $2,000 en efectivo en tu inventario.', rec: 650 },
            { id: 'renovador', titulo: 'Renovador. Construir un total de 5 casas en tus propiedades.', rec: 500 },
            { id: 'monopolio', titulo: 'Monopolio total. Ser dueño de los 3 sets más caros del tablero', rec: 1500 },
            { id: 'intocable', titulo: 'El intocable. Lograr que otro jugador caiga en tus propiedades 5 veces sin declararte en bancarrota.', rec: 400}
            ];

        misiones.forEach(m => {
            let item = document.createElement('li');
            item.innerHTML = `${m.titulo} - <b>$${m.rec}</b> ${completadas[m.id] ? '✅'}`;
            lista.appendChild(item);
        });

        document.getElementById('modal-misiones').style.display = 'block';
    });
}
    
    function verificarBancarrota(jugadorIdx, saldo) {
        if (saldo < 0) {
            log("¡" + nombres[jugadorIdx] + " ha caído en números rojos!");
            document.getElementById('modal-title').innerText = "¡Bancarrota!";
            document.getElementById('modal-text').innerText = "Tu saldo es $" + saldo + ". ¡Te recomiendo un préstamo!";
            document.getElementById('modal-extra').innerHTML = `<button class="btn" onclick="abrirBanco()">Ir al Banco</button>`;
            document.getElementById('modal').style.display = 'block';
        }
    }

    function abrirIntercambio() {
        db.ref('salas/' + sala).once('value', snap => {
            let data = snap.val();
            let misProps = [];
            if(data.propiedades) {
                Object.keys(data.propiedades).forEach(pIdx => {
                    if(data.propiedades[pIdx].owner === miIdx) misProps.push(pIdx);
                });
            }
            document.getElementById('modal-title').innerText = "Revender Propiedad";
            let html = "Selecciona propiedad y comprador:<br>";
            if(misProps.length === 0) { html += "No tienes propiedades."; }
            else {
                misProps.forEach(pIdx => {
                    let p = mapa[pIdx];
                    html += `<br><b>${p.n}</b> ($${p.p}): <select id="sel-${pIdx}">`;
                    data.jugadores.forEach((j, i) => { if(i !== miIdx) html += `<option value="${i}">${nombres[i]}</option>`; });
                    html += `</select> <button class="btn" onclick="proponerVenta(${pIdx})">Vender</button>`;
                });
            }
            document.getElementById('modal-text').innerHTML = html;
            document.getElementById('modal').style.display = 'block';
        });
    }

    function proponerVenta(pIdx) {
        let comprador = document.getElementById('sel-'+pIdx).value;
        let precio = Math.floor(mapa[pIdx].p * 0.8);
        db.ref('salas/' + sala + '/ofertas').push({prop: pIdx, de: miIdx, para: comprador, precio: precio});
        log(nombres[miIdx] + " propuso vender " + mapa[pIdx].n + " a " + nombres[comprador] + " por $" + precio);
        document.getElementById('modal').style.display = 'none';
    }

    function escucharOfertas() {
        db.ref('salas/' + sala + '/ofertas').on('child_added', snap => {
            let o = snap.val();
            if(o.para == miIdx) {
                document.getElementById('modal-title').innerText = "¡Oferta de compra!";
                document.getElementById('modal-text').innerText = nombres[o.de] + " quiere venderte " + mapa[o.prop].n + " por $" + o.precio;
                document.getElementById('modal-extra').innerHTML = `<button class="btn" onclick="confirmarCompra('${snap.key}')">Aceptar</button>`;
                document.getElementById('modal').style.display = 'block';
            }
        });
    }

    function confirmarCompra(oKey) {
        db.ref('salas/' + sala + '/ofertas/' + oKey).once('value', snap => {
            let o = snap.val();
            db.ref('salas/' + sala + '/jugadores').transaction(j => {
                if(j[miIdx].dinero >= o.precio) {
                    j[miIdx].dinero -= o.precio;
                    j[o.de].dinero += o.precio;
                    return j;
                }
                return;
            });
            db.ref('salas/' + sala + '/propiedades/' + o.prop).update({owner: miIdx, hipotecada: false});
            log(nombres[miIdx] + " compró " + mapa[o.prop].n + " a " + nombres[o.de]);
            db.ref('salas/' + sala + '/ofertas/' + oKey).remove();
            document.getElementById('modal').style.display = 'none';
        });
    }

   function verPropiedad(pos, esCaida = false) {
        let p = mapa[pos];
        if (p.p === 0) return;
        let extra = document.getElementById('modal-extra'); extra.innerHTML = "";
        
        db.ref('salas/' + sala).once('value', snap => {
            let data = snap.val();
            let prop = data.propiedades ? data.propiedades[pos] : null;
            let multClima = data.clima !== undefined ? climas[data.clima].mult : 1.0;
            
            document.getElementById('modal-title').innerText = "Tarjeta de Propiedad";
            let porcentajes = [0.10, 0.15, 0.20, 0.30, 0.40, 0.50];
            let nivelesNombres = ["Base", "1 Casa", "2 Casas", "3 Casas", "4 Casas", "Hotel"];
            let listaAlquileres = "";
            porcentajes.forEach((porc, i) => {
                listaAlquileres += `<li>${nivelesNombres[i]}: $${Math.floor(p.p * porc * multClima)}</li>`;
            });

            let niveles = ["Ninguna", "1 Casa", "2 Casas", "3 Casas", "4 Casas", "Hotel"];
            let htmlCard = `<div class="card-property">
                <div class="card-header">${p.n}</div>
                <p>Valor de compra: <b>$${p.p}</b></p>`;
            
            if (!prop) {
                htmlCard += `<p>Estado: <b>Disponible</b></p>`;
                if(esCaida) extra.innerHTML = `<button class="btn" onclick="comprar(${pos})">Comprar</button>`;
            } else if (prop.owner === miIdx) {
                htmlCard += `<p>Dueño: <b>Tú</b></p><p>Nivel: <b>${niveles[prop.nivel || 0]}</b></p>
                             <p>Estado: <b>${prop.hipotecada ? "Hipotecada" : "Activa"}</b></p>`;
                if (!prop.hipotecada) {
                    if (prop.nivel < 5) extra.innerHTML += `<button class="btn" onclick="mejorar(${pos})">Mejorar ($50)</button>`;
                    extra.innerHTML += `<button class="btn" style="background: #ad0c0c;" onclick="hipotecar(${pos})">Hipotecar (+$${Math.floor(p.p/2)})</button>`;
                } else {
                    extra.innerHTML += `<button class="btn" onclick="liberar(${pos})">Liberar (-$${Math.floor(p.p*0.6)})</button>`;
                }
            } else {
                if(prop.hipotecada) {
                    htmlCard += `<p>Dueño: <b>${nombres[prop.owner]}</b> (Hipotecada)</p>`;
                } else {
                    let alquilerActual = Math.floor(p.p * porcentajes[prop.nivel || 0] * multClima);
                    htmlCard += `<p>Dueño: <b>${nombres[prop.owner]}</b></p>
                                 <p>Alquiler actual: <b>$${alquilerActual}</b></p>
                                 <p style="font-size: 10px; margin-top: 5px;"><b>Tabla de precios (Clima: ${data.clima !== undefined ? climas[data.clima].n : '-'}):</b></p>
                                 <ul style="font-size: 10px; padding-left: 15px; margin: 0;">${listaAlquileres}</ul>`;
                    
                    if(esCaida && prop.owner !== miIdx) {
                        alquilerPendiente = {a: prop.owner, m: alquilerActual};
                        extra.innerHTML = `
                            <button class="btn" onclick="procesarPago(${miIdx}, ${prop.owner}, ${alquilerActual})">Pagar Alquiler</button>
                            <button class="btn" style="background:#ff80bf" onclick="intentarEvasion(${miIdx}, ${prop.owner}, ${alquilerActual})">Intentar Evasión</button>
                        `;
                    }
                }
            }
            htmlCard += `</div>`;
            document.getElementById('modal-text').innerHTML = htmlCard;
            document.getElementById('modal').style.display = 'block';
        });
    }

    function hipotecar(pos) { db.ref('salas/'+sala+'/propiedades/'+pos).update({hipotecada: true}); db.ref('salas/'+sala+'/jugadores/'+miIdx+'/dinero').transaction(d => d + Math.floor(mapa[pos].p/2)); log(nombres[miIdx] + " hipotecó " + mapa[pos].n); document.getElementById('modal').style.display = 'none'; }
    function liberar(pos) { db.ref('salas/'+sala+'/propiedades/'+pos).update({hipotecada: false}); db.ref('salas/'+sala+'/jugadores/'+miIdx+'/dinero').transaction(d => d - Math.floor(mapa[pos].p*0.6)); log(nombres[miIdx] + " liberó " + mapa[pos].n); document.getElementById('modal').style.display = 'none'; }
    function intentarEvasion(d, a, m) { let exito = Math.random() < 0.30; if(exito) { let montoFinal = Math.floor(m / 2); procesarPago(d, a, montoFinal, true); log(nombres[d] + " evadió el alquiler exitosamente. Pagará $" + montoFinal); } else { let montoFinal = m + 50; procesarPago(d, a, montoFinal, false); log(nombres[d] + " falló su evasión de pago. Paga $" + montoFinal); } }

    function manejarCasilla(pos) {
        let p = mapa[pos];
        if (p.n === "A LA CÁRCEL" || p.n === "CÁRCEL") {
            db.ref('salas/'+sala+'/jugadores/'+miIdx).update({pos: 8, enCarcel: 2});
            log(nombres[miIdx] + " fue enviado a la cárcel.");
            document.getElementById('modal-title').innerText = "Cárcel";
            document.getElementById('modal-text').innerText = "¡Estás en la cárcel!";
            document.getElementById('modal-extra').innerHTML = `<button class="btn" onclick="pagarFianza()">Pagar Fianza ($100)</button><button class="btn" onclick="quedarseEnCarcel()">Quedarse</button>`;
            document.getElementById('modal').style.display = 'block';
            turnosSeis = 0;
            pasarTurno();
            return;
        }
        if (p.n === "?" || p.n === "ARCA COMUNAL") { 
        ejecutarEvento(p.n); 
        return; 
    }


        if (p.n === "PARADA") {
        db.ref('salas/' + sala + '/impuestosAcumulados').once('value', snap => {
            let acumulado = snap.val() || 0;
            if (acumulado > 0) {
                db.ref('salas/' + sala + '/jugadores/' + miIdx + '/dinero').transaction(d => d + acumulado);
                log(nombres[miIdx] + " llegó a la PARADA y cobró $" + acumulado + " de impuestos acumulados.");
                db.ref('salas/' + sala + '/impuestosAcumulados').set(0); // Reiniciar bolsa
            } else {
                log(nombres[miIdx] + " llegó a la PARADA, pero no había impuestos acumulados.");
            }
        });
        return;
    }
        
        if (p.n === "IMPUESTOS") {
            db.ref('salas/' + sala + '/jugadores/' + miIdx + '/dinero').transaction(d => {
                let nuevo = Number(d) - 100;
                setTimeout(() => verificarBancarrota(miIdx, nuevo), 500);
                return nuevo;
            });
            
            // AGREGA ESTA LÍNEA PARA ACUMULAR EL DINERO:
            db.ref('salas/' + sala + '/impuestosAcumulados').transaction(a => (a || 0) + 100);
            
            log(nombres[miIdx] + " pagó impuestos de $100.");
            document.getElementById('modal-title').innerText = "Impuestos";
            document.getElementById('modal-text').innerText = "Pagaste $100.";
            document.getElementById('modal-extra').innerHTML = "";
            document.getElementById('modal').style.display = 'block';
            return;
            
        }
        verPropiedad(pos, true);
    }

    function pagarFianza() { db.ref('salas/'+sala+'/jugadores/'+miIdx).update({enCarcel: 0, dinero: firebase.database.ServerValue.increment(-100)}); log(nombres[miIdx] + " pagó la fianza."); document.getElementById('modal').style.display = 'none'; }
    function quedarseEnCarcel() { log(nombres[miIdx] + " cumplirá su condena en la cárcel."); document.getElementById('modal').style.display = 'none'; }

    function pasarTurno() {
        turnosSeis = 0;
        db.ref('salas/'+sala+'/jugadores').once('value', snap => {
            let total = snap.numChildren();
            db.ref('salas/'+sala+'/turno').once('value', tSnap => {
                let t = Number(tSnap.val());
                let nuevoTurno = (t + 1) % total;
                db.ref('salas/'+sala+'/jugadores/'+nuevoTurno).once('value', jSnap => {
                    let jugador = jSnap.val();
                    if(jugador.enCarcel > 0) {
                        log(nombres[nuevoTurno] + " está en la cárcel.");
                        db.ref('salas/'+sala+'/jugadores/'+nuevoTurno).update({ enCarcel: jugador.enCarcel - 1 });
                        db.ref('salas/'+sala+'/turno').set((nuevoTurno + 1) % total);
                    } else { db.ref('salas/'+sala+'/turno').set(nuevoTurno); }
                });
            });
        });
    }

    function ejecutarEvento(nombreCasilla) {
        let carta = obtenerCarta();
        db.ref('salas/'+sala+'/jugadores/'+miIdx+'/dinero').transaction(d => {
            let nuevo = Number(d) + carta.v;
            setTimeout(() => verificarBancarrota(miIdx, nuevo), 500);
            return nuevo;
        });
        log(nombres[miIdx] + " cayó en " + nombreCasilla + ": " + carta.txt);
        document.getElementById('modal-title').innerText = nombreCasilla;
        document.getElementById('modal-text').innerText = carta.txt;
        document.getElementById('modal-extra').innerHTML = ""; 
        document.getElementById('modal').style.display = 'block';
    }

    function procesarPago(d, a, m, esEvasionLog = false) {
        db.ref('salas/' + sala + '/jugadores').transaction(j => {
            if(!j) return;
            j[d].dinero = Number(j[d].dinero) - m;
            j[a].dinero = Number(j[a].dinero) + m;
            setTimeout(() => { db.ref('salas/' + sala + '/jugadores/' + d + '/dinero').once('value', s => verificarBancarrota(d, s.val())); }, 500);
            return j;
        });
        if(!esEvasionLog) log(nombres[d] + " pagó $" + m + " a " + nombres[a]);
        alquilerPendiente = null;
        document.getElementById('modal').style.display = 'none';
    }

    function comprar(pos) { log(nombres[miIdx] + " compró " + mapa[pos].n); db.ref('salas/' + sala + '/propiedades/' + pos).set({owner: miIdx, nivel: 0, hipotecada: false}); db.ref('salas/' + sala + '/jugadores/' + miIdx + '/dinero').transaction(d => Number(d) - Number(mapa[pos].p)); document.getElementById('modal').style.display = 'none'; }
    function mejorar(pos) {
    db.ref('salas/' + sala).once('value', snap => {
        let data = snap.val();
        let grupo = obtenerGrupo(pos);
        
        // 1. Extraer la propiedad correctamente
        let prop = data.propiedades ? data.propiedades[pos] : null;

        // 2. Validar que el jugador posee todas las propiedades del grupo
        let todasPropias = grupo.indices.every(idx => 
            data.propiedades && 
            data.propiedades[idx] && 
            data.propiedades[idx].owner === miIdx
        );

        if (!todasPropias) {
            document.getElementById('modal-title').innerText = "¡Acción Bloqueada!";
            document.getElementById('modal-text').innerText = "Necesitas ser dueño de todas las propiedades del mismo grupo de color para poder construir.";
            document.getElementById('modal-extra').innerHTML = ""; 
            document.getElementById('modal').style.display = 'block';
            return;
        }

        // 3. Validar nivel máximo (Hotel es nivel 5)
        // Ahora 'prop' ya está definida arriba
        if (prop && prop.nivel >= 5) {
            log("Ya has alcanzado el nivel máximo (Hotel).");
            return;
        }

        // 4. Ejecutar mejora
        log(nombres[miIdx] + " mejoró " + mapa[pos].n);
        
        db.ref('salas/' + sala + '/propiedades/' + pos + '/nivel')
          .transaction(n => (Number(n) || 0) + 1);
          
        db.ref('salas/' + sala + '/jugadores/' + miIdx + '/dinero')
          .transaction(d => Number(d) - 200);
          
        cerrarModal();
    });
}
    
    function tirarDado() { 
        if(miIdx === -1) return;
        db.ref('salas/' + sala).once('value', snap => {
            let s = snap.val(); 
            if(s.turno !== miIdx || s.jugadores[miIdx].enCarcel > 0) return;
            
            // Lógica de clima inicial al primer movimiento
            if (s.clima === undefined) {
                let climaInicial = Math.floor(Math.random() * 9); // Indices para Primavera, Verano, Otoño
                db.ref('salas/' + sala + '/clima').set(climaInicial);
                log("¡El clima inicial es " + climas[climaInicial].n + "!");
            }

            let dado = Math.floor(Math.random()*6)+1;
            document.getElementById('dado-valor').innerText = dado;
            let posActual = Number(s.jugadores[miIdx].pos);
            let nuevaPos = (posActual + dado) % mapa.length;
            if (nuevaPos < posActual) { db.ref('salas/'+sala+'/jugadores/'+miIdx+'/dinero').transaction(d => d + 100); log(nombres[miIdx] + " pasó por SALIDA y cobró $100."); }
            db.ref('salas/' + sala + '/jugadores/' + miIdx + '/pos').set(nuevaPos);
            pasarTurno();
            setTimeout(() => manejarCasilla(nuevaPos), 600);
        }); 
    }

    function abrirBanco() { const montos = [200, 300, 450, 670, 800, 1000]; document.getElementById('modal-title').innerText = "Solicitar Préstamo"; let htmlExtra = ""; montos.forEach(m => { htmlExtra += `<button class="btn" onclick="pedirPrestamo(${m})">Pedir $${m}</button>`; }); document.getElementById('modal-extra').innerHTML = htmlExtra; document.getElementById('modal').style.display = 'block'; }
    function pedirPrestamo(m) { db.ref('salas/' + sala + '/jugadores/' + miIdx).once('value', snap => { let jugador = snap.val(); if (jugador.tienePrestamo) { document.getElementById('modal-title').innerText = "Acción Denegada";
            document.getElementById('modal-text').innerText = "Ya tienes un préstamo activo. ¡Págalo primero antes de solicitar otro!";
            document.getElementById('modal-extra').innerHTML = "";
            document.getElementById('modal').style.display = 'block';
            return;
        }
            db.ref('salas/' + sala + '/jugadores/' + miIdx).update({ 
            dinero: firebase.database.ServerValue.increment(m), 
            tienePrestamo: true, 
            montoPrestamo: m 
        });
        
        log(nombres[miIdx] + " pidió un préstamo de $" + m);
        cerrarModal();
    });
}                                                                                           
                                                                                                       
    function pagarPrestamo() { db.ref('salas/' + sala + '/jugadores/' + miIdx).once('value', snap => { let j = snap.val(); if (j.tienePrestamo) { if (j.dinero >= j.montoPrestamo) { db.ref('salas/' + sala + '/jugadores/' + miIdx).update({ dinero: firebase.database.ServerValue.increment(-j.montoPrestamo), tienePrestamo: false, montoPrestamo: 0 }); log(nombres[miIdx] + " liquidó su préstamo."); } else { document.getElementById('modal-title').innerText = "Fondos insuficientes"; document.getElementById('modal-text').innerHTML = `<div class="empty-debt">No tienes suficiente dinero para pagar el préstamo.</div>`; document.getElementById('modal-extra').innerHTML = ""; document.getElementById('modal').style.display = 'block'; } } else { document.getElementById('modal-title').innerText = "Banco"; document.getElementById('modal-text').innerHTML = `<div class="empty-debt">No tienes préstamos pendientes.</div>`; document.getElementById('modal-extra').innerHTML = ""; document.getElementById('modal').style.display = 'block'; } }); }
    function verSaldos() { db.ref('salas/' + sala + '/jugadores').once('value', snap => { let txt = ""; snap.forEach(c => { txt += nombres[parseInt(c.key)] + ": $" + c.val().dinero + "<br>"; }); document.getElementById('modal-title').innerText = "Saldos"; document.getElementById('modal-text').innerHTML = txt; document.getElementById('modal').style.display = 'block'; }); }
    function enviarChat() { let msg = document.getElementById('chat-msg').value; db.ref('salas/' + sala + '/chat').push({ n: nombres[miIdx], m: msg }); document.getElementById('chat-msg').value = ""; }
    
    function sincronizar() { 
        escucharOfertas();
        db.ref('salas/' + sala).on('value', snap => { 
            let s = snap.val(); if(!s) return; 
            document.getElementById('dinero-mio').innerText = s.jugadores[miIdx].dinero;
            document.getElementById('turno-text').innerText = "Turno: " + nombres[s.turno];
            if(s.clima !== undefined) { let c = climas[s.clima]; document.getElementById('clima-display').innerText = "Estación: " + c.n; }
            s.jugadores.forEach((j, i) => { 
                let el = document.getElementById('p' + i); el.style.display = 'block'; 
                let cell = document.getElementById('cell-' + j.pos); 
                el.style.left = (cell.offsetLeft + 30) + 'px'; el.style.top = (cell.offsetTop + 30) + 'px'; 
            });
            if(s.propiedades) { Object.keys(s.propiedades).forEach(pos => { 
                let cell = document.getElementById('cell-' + pos);
                if(cell) {
                    cell.style.backgroundColor = s.propiedades[pos].hipotecada ? "#ccc" : colores[s.propiedades[pos].owner];
                    let hc = cell.querySelector('.house-container'); hc.innerHTML = "";
                    let nivel = s.propiedades[pos].nivel || 0;
                    if(nivel > 0 && nivel < 5) { for(let i=0; i<nivel; i++) { let h = document.createElement('div'); h.className = 'house'; hc.appendChild(h); } }
                    else if(nivel === 5) { let h = document.createElement('div'); h.className = 'hotel'; hc.appendChild(h); }
                }
            }); }
            if(s.chat) { let h = ""; Object.values(s.chat).forEach(c => h += "<b>"+c.n+":</b> "+c.m+"<br>"); document.getElementById('chat-log').innerHTML = h; }
            if(s.log) { let h = ""; Object.values(s.log).forEach(l => h += l + "<br>"); document.getElementById('log').innerHTML = h; }
        }); 
    }

    mapa.forEach((m, i) => { 
    const d = document.createElement('div'); 
    d.className = 'cell'; 
    d.id = 'cell-' + i; 
    d.onclick = () => verPropiedad(i);
        d.innerHTML = `<div class="strip"></div>${m.n}<br>${m.p > 0 ? '$'+m.p : ''}<div class="house-container"></div>`; 
         let g = obtenerGrupo(i);
    d.innerHTML = `<div class="strip" style="background: ${g ? g.color : 'transparent'}"></div>${m.n}<br>${m.p > 0 ? '$'+m.p : ''}<div class="house-container"></div>`; 
    
    document.getElementById('board').appendChild(d); 
});
</script>
</body>
</html>
